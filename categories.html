<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جميع الأقسام - متجر البيت</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Google Fonts (Cairo) -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8f9fa;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

    <!-- الهيدر الرئيسي -->
    <header class="bg-white shadow-sm sticky top-0 z-50 px-4 py-3.5">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="/" class="p-1.5 text-gray-700 hover:text-orange-600 transition-colors" aria-label="الرئيسية">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </a>
                <a href="/" class="flex items-center">
                    <img src="logo192.png" alt="متجر البيت" class="w-10 h-10 object-contain rounded-xl shadow-sm border border-gray-100 bg-white p-1">
                </a>
            </div>
            <div class="text-center flex-1 mx-2">
                <h1 class="text-base md:text-xl font-black text-orange-600">جميع أقسام المتجر</h1>
            </div>
            <div class="w-10"></div>
        </div>
    </header>

    <!-- محتوى الأقسام -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
        <div id="topBannerAds" class="w-full"></div>
        <div class="flex items-center justify-between">
            <h2 class="font-bold text-gray-800 text-lg">اختر القسم المناسب لك</h2>
            <span id="categories-count" class="text-xs text-gray-400 font-semibold">جاري التحميل...</span>
        </div>

        <!-- شبكة عرض الأقسام بشكل شيك ومتجاوب -->
        <div id="all-categories-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <!-- كروت الأقسام هتتحمل هنا ديناميكياً -->
            <div class="col-span-full text-center py-12 text-gray-400 text-sm">جاري تحميل الأقسام...</div>
        </div>
    </main>

    <!-- السكريبت لجلب الأقسام من قاعدة البيانات -->
    <script>
        const SUPABASE_URL = 'https://usaqiylvcnmccgpnxwaq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_he-h5ysxqK0VLujbtAXcUg_K5qf1rSB';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchAllCategories() {
            const container = document.getElementById('all-categories-container');
            const countLabel = document.getElementById('categories-count');

            try {
                const { data: categories, error } = await db.from('categories').select('*');
                if (error) throw error;

                if (!categories || categories.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-center py-12 text-gray-400 text-sm">لا توجد أقسام مضافة حالياً.</div>';
                    countLabel.innerText = '0 قسم';
                    return;
                }

                countLabel.innerText = `${categories.length} قسم متاحة`;
                container.innerHTML = '';

                categories.forEach(cat => {
                    const iconSrc = cat.image_url ? cat.image_url : 'logo192.png';
                    const card = `
                        <a href="category.html?id=${cat.id}" class="bg-white border border-gray-100 rounded-2xl p-4 flex flex-col items-center justify-center text-center shadow-sm hover:border-orange-500 hover:shadow-md transition-all group">
                            <div class="w-20 h-20 bg-orange-50/50 rounded-2xl flex items-center justify-center mb-3 overflow-hidden shadow-inner border border-orange-100/50 group-hover:scale-105 transition-transform">
                                <img src="${iconSrc}" alt="${cat.name}" class="w-full h-full object-cover">
                            </div>
                            <h3 class="font-bold text-gray-800 text-sm group-hover:text-orange-600 transition-colors truncate w-full">${cat.name}</h3>
                            <span class="text-[11px] text-gray-400 mt-1">تصفح الإعلانات</span>
                        </a>
                    `;
                    container.innerHTML += card;
                });

            } catch (err) {
                console.error('خطأ في جلب الأقسام:', err.message);
                container.innerHTML = '<div class="col-span-full text-center py-12 text-red-400 text-sm">تعذر تحميل الأقسام، حاول مرة أخرى.</div>';
                countLabel.innerText = 'خطأ';
            }
        }

        fetchAllCategories();
    </script>
</body>
</html>
