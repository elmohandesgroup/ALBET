<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جميع الأقسام - متجر البيت</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Google Fonts (Cairo) -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8f9fa;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

    <!-- الهيدر الرئيسي المطابق تماماً للصفحة الرئيسية -->
    <header class="bg-white shadow-sm sticky top-0 z-50 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <!-- زر أضف إعلانك على الشمال -->
            <div class="flex items-center">
                <a href="add-ad.html" class="bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-bold shadow-sm transition-all flex items-center gap-1.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
                    </svg>
                    <span>أضف إعلانك</span>
                </a>
            </div>

            <!-- اللوجو واسم المتجر في منتصف الهيدر -->
            <div class="text-center flex-1 mx-2">
                <a href="/" class="inline-block">
                    <h1 class="text-base sm:text-xl font-black text-orange-600 tracking-tight">متجر البيت</h1>
                    <p class="text-[10px] text-gray-400 font-semibold -mt-1">الأفضل دائماً</p>
                </a>
            </div>

            <!-- أيقونة المتجر وزر القائمة الجانبية (البرجر) على اليمين -->
            <div class="flex items-center gap-2">
                <a href="/" class="w-10 h-10 rounded-xl border border-gray-100 bg-white p-1 shadow-sm flex items-center justify-center">
                    <img src="logo192.png" alt="متجر البيت" class="w-full h-full object-contain">
                </a>
                <button id="menu-btn" class="p-2 text-gray-700 hover:text-orange-600 transition-colors focus:outline-none" aria-label="القائمة">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- القائمة الجانبية المنسدلة (Sidebar Menu) -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-50 hidden transition-opacity opacity-0"></div>
    <aside id="sidebar-menu" class="fixed top-0 right-0 w-80 max-w-[85%] h-full bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-4 border-b border-gray-100 flex items-center justify-between bg-orange-50/30">
            <div class="flex items-center gap-2">
                <img src="logo192.png" alt="متجر البيت" class="w-8 h-8 rounded-lg object-contain">
                <span class="font-black text-orange-600 text-base">متجر البيت</span>
            </div>
            <button id="close-sidebar" class="p-1.5 text-gray-400 hover:text-gray-700 rounded-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto p-4 space-y-3">
            <a href="/" class="flex items-center gap-3 p-3 rounded-xl hover:bg-orange-50 text-gray-700 hover:text-orange-600 font-semibold transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-orange-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                <span>الرئيسية</span>
            </a>
            <a href="categories.html" class="flex items-center gap-3 p-3 rounded-xl bg-orange-50 text-orange-600 font-semibold transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-orange-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-16zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-16z"/></svg>
                <span>جميع الأقسام</span>
            </a>
            <a href="add-ad.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-orange-50 text-gray-700 hover:text-orange-600 font-semibold transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-orange-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                <span>أضف إعلانك مجاناً</span>
            </a>
        </div>
    </aside>

    <!-- محتوى الأقسام والبانرات -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
        <!-- بانر الإعلانات العلوي المخصص لصفحة الأقسام -->
        <div id="topBannerAds" class="w-full"></div>

        <div class="flex items-center justify-between">
            <h2 class="font-bold text-gray-800 text-lg">اختر القسم المناسب لك</h2>
            <span id="categories-count" class="text-xs text-gray-400 font-semibold">جاري التحميل...</span>
        </div>

        <!-- شبكة الأقسام -->
        <div id="all-categories-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <div class="col-span-full text-center py-12 text-gray-400 text-sm">جاري تحميل الأقسام...</div>
        </div>
    </main>

    <!-- السكريبتات البرمجية للبانرات والأقسام والقائمة الجانبية -->
    <script>
        const SUPABASE_URL = 'https://usaqiylvcnmccgpnxwaq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_he-h5ysxqK0VLujbtAXcUg_K5qf1rSB';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // تشغيل القائمة الجانبية (Sidebar Toggle)
        const menuBtn = document.getElementById('menu-btn');
        const closeSidebar = document.getElementById('close-sidebar');
        const sidebarMenu = document.getElementById('sidebar-menu');
        const sidebarOverlay = document.getElementById('sidebar-overlay');

        function toggleSidebar() {
            const isOpen = sidebarMenu.classList.contains('translate-x-0');
            if (isOpen) {
                sidebarMenu.classList.remove('translate-x-0');
                sidebarMenu.classList.add('translate-x-full');
                sidebarOverlay.classList.remove('opacity-100');
                sidebarOverlay.classList.add('opacity-0');
                setTimeout(() => sidebarOverlay.classList.add('hidden'), 300);
            } else {
                sidebarOverlay.classList.remove('hidden');
                setTimeout(() => {
                    sidebarMenu.classList.remove('translate-x-full');
                    sidebarMenu.classList.add('translate-x-0');
                    sidebarOverlay.classList.remove('opacity-0');
                    sidebarOverlay.classList.add('opacity-100');
                }, 10);
            }
        }

        if (menuBtn) menuBtn.addEventListener('click', toggleSidebar);
        if (closeSidebar) closeSidebar.addEventListener('click', toggleSidebar);
        if (sidebarOverlay) sidebarOverlay.addEventListener('click', toggleSidebar);

        // دالة الـ Slider للبانرات
        function setupSlider(containerId, mediaArray) {
            const container = document.getElementById(containerId);
            if (!container || mediaArray.length === 0) return;

            let slidesHtml = '';
            let dotsHtml = '';

            mediaArray.forEach((media, index) => {
                slidesHtml += `
                    <div class="absolute inset-0 transition-opacity duration-700 ease-in-out ${index === 0 ? 'opacity-100 z-10' : 'opacity-0 z-0'} ${containerId}-slide">
                        <div class="w-full h-40 md:h-56 rounded-2xl overflow-hidden shadow-sm bg-gray-100 relative">
                            <img src="${media.url}" alt="${media.title || 'إعلان مميز'}" class="w-full h-full object-cover">
                        </div>
                    </div>
                `;
                dotsHtml += `
                    <button class="w-2 h-2 rounded-full transition-all ${index === 0 ? 'bg-orange-600 w-4' : 'bg-white/70'} ${containerId}-dot" aria-label="شريحة"></button>
                `;
            });

            container.innerHTML = `
                <div class="relative w-full h-40 md:h-56 rounded-2xl shadow-sm">
                    ${slidesHtml}
                    <div class="absolute bottom-2 left-0 right-0 z-20 flex justify-center items-center gap-1.5">
                        ${dotsHtml}
                    </div>
                </div>
            `;

            if (mediaArray.length > 1) {
                let currentIdx = 0;
                const slides = container.querySelectorAll(`.${containerId}-slide`);
                const dots = container.querySelectorAll(`.${containerId}-dot`);

                setInterval(() => {
                    slides[currentIdx].classList.remove('opacity-100', 'z-10');
                    slides[currentIdx].classList.add('opacity-0', 'z-0');
                    if (dots[currentIdx]) {
                        dots[currentIdx].classList.remove('bg-orange-600', 'w-4');
                        dots[currentIdx].classList.add('bg-white/70');
                    }

                    currentIdx = (currentIdx + 1) % slides.length;

                    slides[currentIdx].classList.remove('opacity-0', 'z-0');
                    slides[currentIdx].classList.add('opacity-100', 'z-10');
                    if (dots[currentIdx]) {
                        dots[currentIdx].classList.remove('bg-white/70');
                        dots[currentIdx].classList.add('bg-orange-600', 'w-4');
                    }
                }, 3500);
            }
        }

        // جلب البانرات المخصصة لصفحة الأقسام من قاعدة البيانات
        async function fetchBannerAds() {
            try {
                const { data: banners, error } = await db
                    .from('featured_companies')
                    .select('*')
                    .eq('position', 'above')
                    .eq('page_target', 'categories.html');

                if (error || !banners) return;

                let allTopMedia = [];
                banners.forEach(banner => {
                    if (banner.images && banner.images.length > 0) {
                        banner.images.forEach(imgUrl => {
                            allTopMedia.push({ url: imgUrl, title: banner.title });
                        });
                    }
                });

                setupSlider('topBannerAds', allTopMedia);
            } catch (e) {
                console.log('خطأ في جلب البانرات:', e);
            }
        }

        // جلب الأقسام
        async function fetchAllCategories() {
            const container = document.getElementById('all-categories-container');
            const countLabel = document.getElementById('categories-count');

            try {
                const { data: categories, error } = await db.from('categories').select('*');
                if (error) throw error;

                if (!categories || categories.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-center py-12 text-gray-400 text-sm">لا توجد أقسام مضافة حالياً.</div>';
                    countLabel.innerText = '0 قسم';
                    return;
                }

                countLabel.innerText = `${categories.length} قسم متاحة`;
                container.innerHTML = '';

                categories.forEach(cat => {
                    const iconSrc = cat.image_url ? cat.image_url : 'logo192.png';
                    const card = `
                        <a href="category.html?id=${cat.id}" class="bg-white border border-gray-100 rounded-2xl p-4 flex flex-col items-center justify-center text-center shadow-sm hover:border-orange-500 hover:shadow-md transition-all group">
                            <div class="w-20 h-20 bg-orange-50/50 rounded-2xl flex items-center justify-center mb-3 overflow-hidden shadow-inner border border-orange-100/50 group-hover:scale-105 transition-transform">
                                <img src="${iconSrc}" alt="${cat.name}" class="w-full h-full object-cover">
                            </div>
                            <h3 class="font-bold text-gray-800 text-sm group-hover:text-orange-600 transition-colors truncate w-full">${cat.name}</h3>
                            <span class="text-[11px] text-gray-400 mt-1">تصفح الإعلانات</span>
                        </a>
                    `;
                    container.innerHTML += card;
                });

            } catch (err) {
                console.error('خطأ في جلب الأقسام:', err.message);
                container.innerHTML = '<div class="col-span-full text-center py-12 text-red-400 text-sm">تعذر تحميل الأقسام، حاول مرة أخرى.</div>';
                countLabel.innerText = 'خطأ';
            }
        } 

        fetchAllCategories();
        fetchBannerAds();
    </script>
</body>
</html>
