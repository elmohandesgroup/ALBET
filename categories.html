<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الأقسام - متجر البيت (albet.store)</title>
    
    <script>
        if (localStorage.getItem('isAdminLoggedIn') !== 'true') {
            alert('عذراً، يجب تسجيل الدخول أولاً!');
            window.location.href = 'admin-login.html';
        }
    </script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Cairo', sans-serif;
            color: #1e293b;
            margin: 0;
            padding: 20px;
        }
        .page-grid-container {
            display: grid;
            grid-template-columns: 270px 1fr;
            gap: 20px;
            align-items: start;
        }
        .right-column, .left-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .admin-brand-box {
            background: #111827;
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .admin-logo {
            width: 45px;
            height: 45px;
            object-fit: contain;
            background: white;
            padding: 4px;
            border-radius: 8px;
        }
        .admin-logout-box {
            background: #111827;
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }
        .btn-logout {
            background-color: #e76f51;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .sidebar-box {
            background: white;
            border: 2px solid #111827;
            border-radius: 14px;
            padding: 15px 12px;
        }
        .sidebar-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: #334155;
            padding: 8px 10px;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sidebar-menu-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .side-pill-btn {
            background: #ffffff;
            color: #334155;
            border: 1px solid #e2e8f0;
            padding: 9px 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.83rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
        }
        .side-pill-btn.active {
            background-color: #fff1ed;
            color: #e76f51;
            border-color: #fbd3c9;
        }
        .side-pill-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .side-dot-bullet {
            width: 5px;
            height: 5px;
            background-color: #94a3b8;
            border-radius: 50%;
        }
        .side-pill-btn.active .side-dot-bullet {
            background-color: #e76f51;
        }
        .content-frame-box {
            background: white;
            border: 2px solid #111827;
            border-radius: 14px;
            padding: 25px;
            min-height: 650px;
        }
        .preview-img-box {
            width: 60px;
            height: 60px;
            border: 2px dashed #cbd5e1;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #f8fafc;
        }
        .preview-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .main-category-card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #ffffff;
            padding: 16px;
            margin-bottom: 15px;
        }
        .main-category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            border-bottom: 2px solid #f1f5f9;
        }
        .sub-categories-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 12px;
            padding-right: 15px;
        }
        .sub-category-chip {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="page-grid-container">
        <div class="right-column">
            <div class="admin-brand-box">
                <img src="logo192.png" alt="متجر البيت" class="admin-logo">
                <div>
                    <h3 class="m-0 fw-bold fs-6 text-start">متجر البيت</h3>
                    <small class="text-light opacity-75" style="font-size: 0.72rem;">لوحة تحكم المدير العام - albet.store</small>
                </div>
            </div>

            <div class="sidebar-box">
                <div class="sidebar-title">
                    <span>أقسام الإدارة والتقارير الشاملة</span>
                    <i class="bi bi-grid-fill text-dark"></i>
                </div>
                <div class="sidebar-menu-list">
                    <a href="admin-dashboard.html" class="side-pill-btn">
                        <div class="side-pill-content"><i class="bi bi-shield-check"></i><span>مراجعة الإعلانات</span></div>
                        <span class="side-dot-bullet"></span>
                    </a>
                    <a href="staff.html" class="side-pill-btn">
                        <div class="side-pill-content"><i class="bi bi-people"></i><span>إضافة موظف</span></div>
                        <span class="side-dot-bullet"></span>
                    </a>
                    <a href="categories.html" class="side-pill-btn active">
                        <div class="side-pill-content"><i class="bi bi-folder-plus"></i><span>إضافة قسم</span></div>
                        <span class="side-dot-bullet"></span>
                    </a>
                    <a href="daily-report.html" class="side-pill-btn">
                        <div class="side-pill-content"><i class="bi bi-file-earmark-text"></i><span>تقرير اليوم</span></div>
                        <span class="side-dot-bullet"></span>
                    </a>
                    <a href="profits.html" class="side-pill-btn">
                        <div class="side-pill-content"><i class="bi bi-cash-coin"></i><span>الأرباح والخسائر</span></div>
                        <span class="side-dot-bullet"></span>
                    </a>
                    <a href="salaries.html" class="side-pill-btn">
                        <div class="side-pill-content"><i class="bi bi-wallet2"></i><span>المرتبات</span></div>
                        <span class="side-dot-bullet"></span>
                    </a>
                    <a href="expenses.html" class="side-pill-btn">
                        <div class="side-pill-content"><i class="bi bi-receipt"></i><span>المصروفات</span></div>
                        <span class="side-dot-bullet"></span>
                    </a>
                </div>
            </div>
        </div>

        <div class="left-column">
            <div class="admin-logout-box">
                <button class="btn-logout" onclick="logoutAdmin()">تسجيل الخروج <i class="bi bi-box-arrow-left ms-1"></i></button>
            </div>

            <div class="content-frame-box">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <span class="fw-bold fs-6 text-secondary"><i class="bi bi-folder-plus ms-1"></i> إضافة وإدارة أقسام المنصة (رئيسية وفرعية)</span>
                </div>

                <div class="card p-4 mb-5 bg-light border-0 shadow-sm">
                    <h6 class="fw-bold text-dark mb-3" id="formTitle">إضافة قسم جديد</h6>
                    <form id="categoryForm" onsubmit="saveCategory(event)">
                        <input type="hidden" id="editingCategoryId">
                        <div class="row g-3 align-items-end">
                            <div class="col-md-3">
                                <label class="form-label fw-bold" style="font-size: 0.8rem;">اسم القسم</label>
                                <input type="text" id="categoryName" class="form-control" placeholder="مثال: عقارات، سيارات..." required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold" style="font-size: 0.8rem;">نوع القسم</label>
                                <div class="d-flex gap-3 mt-1">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="categoryType" id="typeMain" value="main" checked onchange="toggleParentSelect()">
                                        <label class="form-check-label fw-semibold" for="typeMain" style="font-size: 0.82rem;">رئيسي</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="categoryType" id="typeSub" value="sub" onchange="toggleParentSelect()">
                                        <label class="form-check-label fw-semibold" for="typeSub" style="font-size: 0.82rem;">فرعي</label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-3" id="parentSelectWrapper" style="display: none;">
                                <label class="form-label fw-bold text-danger" style="font-size: 0.8rem;">اختر القسم الرئيسي الأب</label>
                                <select id="parentCategorySelect" class="form-select border-danger">
                                    <option value="">-- اختر القسم الأب --</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-bold" style="font-size: 0.8rem;">صورة القسم (WebP)</label>
                                <div class="d-flex align-items-center gap-2">
                                    <input type="file" id="categoryImageFile" class="form-control" accept="image/webp, image/png, image/jpeg" onchange="previewImage(event)">
                                    <div class="preview-img-box" id="imagePreviewContainer">
                                        <i class="bi bi-image text-muted fs-4"></i>
                                    </div>
                                </div>
                                <input type="hidden" id="categoryImageUrl">
                            </div>
                            <div class="col-md-2 mt-3">
                                <button type="submit" id="saveBtn" class="btn btn-dark w-100 fw-bold" style="font-size: 0.82rem;">حفظ القسم</button>
                            </div>
                        </div>
                        <div id="cancelEditBox" class="mt-2" style="display:none;">
                            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="resetForm()">إلغاء التعديل</button>
                        </div>
                    </form>
                </div>

                <h6 class="fw-bold text-dark mb-3">هيكلة الأقسام (الرئيسية والأقسام الفرعية التابعة لها)</h6>
                <div id="hierarchicalCategoriesContainer">
                    <div class="text-center text-muted py-4">جاري تحميل الأقسام...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
      const SUPABASE_URL = 'https://usaqiylvcnmccgpnxwaq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzYXFpeWx2Y25tY2NncG54d2FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjU2Mzg5MjYsImV4cCI6MjA0MTIxNDkyNn0.VwK6i8cI6MjAOMTIxNDkyNn0';
       const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let allCategories = [];

        window.onload = () => {
            loadCategories();
        };

        function toggleParentSelect() {
            const isSub = document.getElementById('typeSub').checked;
            const wrapper = document.getElementById('parentSelectWrapper');
            if (isSub) {
                wrapper.style.display = 'block';
                document.getElementById('parentCategorySelect').setAttribute('required', 'true');
            } else {
                wrapper.style.display = 'none';
                document.getElementById('parentCategorySelect').removeAttribute('required');
                document.getElementById('parentCategorySelect').value = '';
            }
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imagePreviewContainer').innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                    document.getElementById('categoryImageUrl').value = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        async function loadCategories() {
            const container = document.getElementById('hierarchicalCategoriesContainer');
            const parentSelect = document.getElementById('parentCategorySelect');
            
            const { data, error } = await supabaseClient.from('categories').select('*').order('id', { ascending: false });
            
            if (error) {
                container.innerHTML = `<div class="text-center text-danger py-3">خطأ في الاتصال بقاعدة البيانات (${error.message})</div>`;
                return;
            }
            
            allCategories = data || [];

            parentSelect.innerHTML = '<option value="">-- اختر القسم الأب --</option>';
            allCategories.forEach(cat => {
                if (!cat.parent_id) {
                    parentSelect.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
                }
            });

            const mainCategories = allCategories.filter(cat => !cat.parent_id);

            if (mainCategories.length > 0) {
                container.innerHTML = mainCategories.map(mainCat => {
                    const subCategories = allCategories.filter(sub => sub.parent_id == mainCat.id);
                    const mainImg = mainCat.image_url ? `<img src="${mainCat.image_url}" width="40" height="40" class="rounded object-fit-cover border">` : `<div class="bg-light rounded d-flex align-items-center justify-content-center border" style="width:40px;height:40px;"><i class="bi bi-folder text-muted"></i></div>`;
                    
                    let subsHtml = '';
                    if (subCategories.length > 0) {
                        subsHtml = `
                            <div class="sub-categories-grid">
                                ${subCategories.map(sub => {
                                    const subImg = sub.image_url ? `<img src="${sub.image_url}" width="28" height="28" class="rounded object-fit-cover border">` : `<i class="bi bi-folder2 text-muted"></i>`;
                                    return `
                                        <div class="sub-category-chip">
                                            ${subImg}
                                            <span>${sub.name}</span>
                                            <div class="ms-auto d-flex gap-1">
                                                <button class="btn btn-sm text-primary p-0" onclick="editCategory('${sub.id}')"><i class="bi bi-pencil-square" style="font-size:0.75rem;"></i></button>
                                                <button class="btn btn-sm text-danger p-0" onclick="deleteCategory('${sub.id}')"><i class="bi bi-trash" style="font-size:0.75rem;"></i></button>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        `;
                    } else {
                        subsHtml = `<div class="text-muted small mt-2" style="font-size:0.78rem; padding-right:15px;">لا توجد أقسام فرعية تابعة لهذا القسم حالياً.</div>`;
                    }

                    return `
                        <div class="main-category-card">
                            <div class="main-category-header">
                                <div class="d-flex align-items-center gap-3">
                                    ${mainImg}
                                    <div>
                                        <h6 class="fw-bold m-0 text-dark" style="font-size:0.9rem;">${mainCat.name}</h6>
                                        <span class="badge bg-success" style="font-size:0.65rem;">قسم رئيسي</span>
                                    </div>
                                </div>
                                <div class="d-flex gap-2">
                                    <button class="btn btn-sm btn-outline-primary py-1 px-2" style="font-size:0.75rem;" onclick="editCategory('${mainCat.id}')">تعديل</button>
                                    <button class="btn btn-sm btn-outline-danger py-1 px-2" style="font-size:0.75rem;" onclick="deleteCategory('${mainCat.id}')">حذف</button>
                                </div>
                            </div>
                            ${subsHtml}
                        </div>
                    `;
                }).join('');
            } else {
                container.innerHTML = '<div class="text-center text-muted py-4">لا توجد أقسام مضافة حتى الآن.</div>';
            }
        }

        async function saveCategory(e) {
            e.preventDefault();
            const id = document.getElementById('editingCategoryId').value;
            const name = document.getElementById('categoryName').value;
            const isSub = document.getElementById('typeSub').checked;
            const parent_id = isSub ? document.getElementById('parentCategorySelect').value : null;
            const image_url = document.getElementById('categoryImageUrl').value;

            if (isSub && !parent_id) {
                alert('يرجى تحديد القسم الرئيسي الأب لهذا القسم الفرعي!');
                return;
            }

            const categoryData = { name, parent_id };
            if (image_url) categoryData.image_url = image_url;

            if (id) {
                const { error } = await supabaseClient.from('categories').update(categoryData).eq('id', id);
                if (error) alert('خطأ في التعديل: ' + error.message);
                else { alert('تم التعديل بنجاح'); resetForm(); loadCategories(); }
            } else {
                const { error } = await supabaseClient.from('categories').insert([categoryData]);
                if (error) alert('خطأ في الإضافة: ' + error.message);
                else { alert('تم الإضافة بنجاح'); resetForm(); loadCategories(); }
            }
        }

        function editCategory(id) {
            const cat = allCategories.find(c => c.id == id);
            if (!cat) return;
            document.getElementById('editingCategoryId').value = cat.id;
            document.getElementById('categoryName').value = cat.name;
            if (cat.parent_id) {
                document.getElementById('typeSub').checked = true;
                toggleParentSelect();
                document.getElementById('parentCategorySelect').value = cat.parent_id;
            } else {
                document.getElementById('typeMain').checked = true;
                toggleParentSelect();
            }
            document.getElementById('categoryImageUrl').value = cat.image_url || '';
            if (cat.image_url) {
                document.getElementById('imagePreviewContainer').innerHTML = `<img src="${cat.image_url}" alt="Preview">`;
            }
            document.getElementById('formTitle').innerText = 'تعديل بيانات القسم';
            document.getElementById('saveBtn').innerText = 'حفظ التعديلات';
            document.getElementById('cancelEditBox').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('categoryForm').reset();
            document.getElementById('editingCategoryId').value = '';
            document.getElementById('typeMain').checked = true;
            toggleParentSelect();
            document.getElementById('imagePreviewContainer').innerHTML = `<i class="bi bi-image text-muted fs-4"></i>`;
            document.getElementById('categoryImageUrl').value = '';
            document.getElementById('formTitle').innerText = 'إضافة قسم جديد';
            document.getElementById('saveBtn').innerText = 'حفظ القسم';
            document.getElementById('cancelEditBox').style.display = 'none';
        }

        async function deleteCategory(id) {
            if (confirm('هل أنت متأكد من حذف هذا القسم؟')) {
                const { error } = await supabaseClient.from('categories').delete().eq('id', id);
                if (error) alert('خطأ أثناء الحذف: ' + error.message);
                else { alert('تم الحذف بنجاح'); loadCategories(); }
            }
        }

        function logoutAdmin() {
            localStorage.removeItem('isAdminLoggedIn');
            window.location.href = 'admin-login.html';
        }
    </script>
</body>
</html>
