<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | متجر ALBET</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --main-orange: #e17055; --dark-bg: #2d3436; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: #f4f7f6; color: #333; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        h2, h4 { margin-bottom: 15px; color: var(--dark-bg); }
        .form-input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 6px; }
        .btn-custom { background: var(--main-orange); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-custom:hover { opacity: 0.9; }
        .order-card { background: #f8f9fa; padding: 12px; margin-bottom: 10px; border-radius: 6px; border-right: 4px solid var(--main-orange); }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--main-orange); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-right"></i> العودة للمتجر</a>
        <h2>لوحة تحكم متجر ALBET</h2>
        
        <h4>إضافة منتج جديد</h4>
        <form onsubmit="addProduct(event)">
            <input type="text" id="p_name" class="form-input" placeholder="اسم المنتج" required>
            <input type="number" id="p_price" class="form-input" placeholder="السعر" required>
            <select id="p_cat" class="form-input">
                <option value="kitchen">المطبخ</option>
                <option value="textiles">المفروشات</option>
                <option value="appliances">الأجهزة</option>
                <option value="decor">الديكور</option>
            </select>
            <input type="url" id="p_img" class="form-input" placeholder="رابط صورة المنتج" required>
            <button type="submit" class="btn-custom">حفظ وإضافة المنتج</button>
        </form>

        <hr style="margin: 25px 0;">
        <h4>الطلبات الواردة</h4>
        <div id="orders-list">جاري جلب الطلبات...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://usaqiylvcnmccgpnxwaq.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_he-h5ysxqK0VLujbtAXcUg_K5q';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function addProduct(e) {
            e.preventDefault();
            const prod = {
                name: document.getElementById('p_name').value,
                price: document.getElementById('p_price').value,
                category: document.getElementById('p_cat').value,
                image: document.getElementById('p_img').value
            };

            const { error } = await _supabase.from('products').insert([prod]);
            if(error) alert('خطأ في إضافة المنتج');
            else {
                alert('تمت إضافة المنتج بنجاح!');
                e.target.reset();
            }
        }

        async function fetchOrders() {
            const { data, error } = await _supabase.from('orders').select('*').order('created_at', { ascending: false });
            const list = document.getElementById('orders-list');
            if(error || !data.length) { list.innerHTML = '<p>لا توجد طلبات حتى الآن.</p>'; return; }

            list.innerHTML = data.map(o => `
                <div class="order-card">
                    <strong>${o.customer_name}</strong> (${o.phone}) - ${o.address}<br>
                    <small>الإجمالي: ${o.total}</small>
                </div>
            `).join('');
        }

        fetchOrders();
    </script>
</body>
</html>
