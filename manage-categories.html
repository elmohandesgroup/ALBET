<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الأقسام - متجر البيت</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/rtl.min.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="d-flex justify-content-between mb-4">
            <h2>إدارة أقسام الموقع</h2>
            <a href="admin-dashboard.html" class="btn btn-secondary">العودة للوحة الرئيسية</a>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form id="addCategoryForm" onsubmit="addNewCategory(event)">
                    <div class="row g-3">
                        <div class="col-md-5">
                            <label class="form-label">اسم القسم (مثال: المطبخ)</label>
                            <input type="text" id="categoryName" class="form-control" required>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label">أيقونة/لوجو القسم</label>
                            <input type="file" id="categoryLogo" class="form-control" accept="image/*" required>
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100">إضافة القسم</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>اللوجو</th>
                            <th>القسم</th>
                            <th>إجراء</th>
                        </tr>
                    </thead>
                    <tbody id="categoriesTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabase = window.supabase.createClient('https://usaqiylvcnmccgpnxwaq.supabase.co', 'YOUR_SUPABASE_ANON_KEY');

        async function loadCategories() {
            const { data, error } = await supabase.from('categories').select('*');
            const tbody = document.getElementById('categoriesTableBody');
            tbody.innerHTML = '';
            if (data) {
                data.forEach(cat => {
                    tbody.innerHTML += `
                        <tr>
                            <td><img src="${cat.logo_url}" width="50" style="border-radius:10px; border:1px solid #ddd;"></td>
                            <td>${cat.name}</td>
                            <td><button class="btn btn-sm btn-danger" onclick="deleteCategory('${cat.id}')">حذف</button></td>
                        </tr>
                    `;
                });
            }
        }

        async function addNewCategory(e) {
            e.preventDefault();
            const name = document.getElementById('categoryName').value;
            const file = document.getElementById('categoryLogo').files[0];
            
            // رفع الصورة
            const fileName = `cat_${Date.now()}_${file.name}`;
            await supabase.storage.from('ads-images').upload(fileName, file);
            const { data: { publicUrl } } = supabase.storage.from('ads-images').getPublicUrl(fileName);

            // حفظ في قاعدة البيانات
            await supabase.from('categories').insert([{ name, logo_url: publicUrl }]);
            
            document.getElementById('addCategoryForm').reset();
            loadCategories();
        }

        async function deleteCategory(id) {
            if(confirm('متأكد؟')) {
                await supabase.from('categories').delete().eq('id', id);
                loadCategories();
            }
        }

        loadCategories();
    </script>
</body>
</html>
