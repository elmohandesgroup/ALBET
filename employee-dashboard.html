<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة مراجعة الإعلانات - موظف متجر البيت</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/rtl.min.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>طابور المراجعة والتدقيق</h2>
            <div>
                <span id="staffNameDisplay" class="fw-bold text-primary ms-3"></span>
                <button class="btn btn-outline-danger btn-sm" onclick="logout()">تسجيل الخروج</button>
            </div>
        </div>

        <!-- جدول الإعلانات المعلقة المسندة للموظف -->
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">الإعلانات الواردة بانتظار الاعتماد</div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead>
                            <tr>
                                <th>صورة الإعلان</th>
                                <th>عنوان الإعلان</th>
                                <th>القسم</th>
                                <th>السعر</th>
                                <th>تاريخ الإضافة</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="tasksTableBody">
                            <!-- سيتم تعبئة البيانات برمجياً عبر الـ JS -->
                            <tr>
                                <td colspan="6" class="text-center text-muted">جاري تحميل المهام...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- ربط مكتبة Supabase وملف مهام الموظفين -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="task-assignment.js"></script>
    <script>
        const SUPABASE_URL = 'https://usaqiylvcnmccgpnxwaq.supabase.co';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const taskManager = new TaskAssignmentManager(supabaseClient);

        // التحقق من الجلسة وجلب بيانات الموظف الحالي
        const currentStaff = JSON.parse(localStorage.getItem('currentStaff'));
        if (!currentStaff) {
            window.location.href = 'employee-login.html';
        } else {
            document.getElementById('staffNameDisplay').innerText = `أهلاً بك، ${currentStaff.name} (${currentStaff.assigned_category || 'عام'})`;
            loadStaffTasks(currentStaff.id);
        }

        // دالة جلب وعرض المهام المسندة للموظف
        async function loadStaffTasks(staffId) {
            const result = await taskManager.fetchStaffTasks(staffId);
            const tbody = document.getElementById('tasksTableBody');
            tbody.innerHTML = '';

            if (result.success && result.data && result.data.length > 0) {
                result.data.forEach(task => {
                    const ad = task.ads;
                    if (!ad) return;
                    
                    tbody.innerHTML += `
                        <tr id="row-${task.id}">
                            <td><img src="${ad.image_url || 'https://via.placeholder.com/60'}" width="60" height="60" class="rounded object-fit-cover" alt="صورة الإعلان"></td>
                            <td>${ad.title}</td>
                            <td><span class="badge bg-secondary">${ad.category}</span></td>
                            <td>${ad.price} جنيه</td>
                            <td>${new Date(ad.created_at).toLocaleDateString('ar-EG')}</td>
                            <td>
                                <button class="btn btn-sm btn-success" onclick="reviewAd('${task.id}', '${ad.id}', 'approve')">اعتماد ونشر</button>
                                <button class="btn btn-sm btn-danger" onclick="reviewAd('${task.id}', '${ad.id}', 'reject')">رفض</button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">لا توجد إعلانات معلقة في طابور المراجعة حالياً. ممتاز!</td></tr>`;
            }
        }

        // دالة اتخاذ قرار المراجعة (قبول أو رفض)
        async function reviewAd(assignmentId, adId, decision) {
            let reason = null;
            if (decision === 'reject') {
                reason = prompt('الرجاء كتابة سبب رفض الإعلان ليتم إرساله للمستخدم:');
                if (!reason) return;
            }

            const res = await taskManager.reviewTask(assignmentId, adId, decision, reason);
            if (res.success) {
                alert(res.message);
                // إعادة تحميل المهام لتحديث الجدول
                loadStaffTasks(currentStaff.id);
            } else {
                alert('حدث خطأ: ' + res.error);
            }
        }

        function logout() {
            localStorage.removeItem('currentStaff');
            window.location.href = 'employee-login.html';
        }
    </script>
</body>
</html>
