<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول المدير العام - متجر البيت</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/rtl.min.css">
    <style>
        body {
            background-color: #f4f6f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .admin-login-card {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }
        .btn-admin {
            background-color: #e76f51;
            color: white;
        }
        .btn-admin:hover {
            background-color: #d75f41;
            color: white;
        }
    </style>
</head>
<body>

    <div class="admin-login-card">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-dark">لوحة تحكم الإدارة</h3>
            <p class="text-muted small">متجر البيت (albet.store)</p>
        </div>
        
        <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
            <div class="mb-3">
                <label for="adminUser" class="form-label">اسم المستخدم (Username)</label>
                <input type="text" id="adminUser" class="form-control" placeholder="أدخل اسم المستخدم للإدارة" required>
            </div>
            <div class="mb-3">
                <label for="adminPass" class="form-label">كلمة المرور (Password)</label>
                <input type="password" id="adminPass" class="form-control" placeholder="********" required>
            </div>
            <button type="submit" class="btn btn-admin w-100 py-2 fw-bold">دخول لوحة التحكم</button>
        </form>
        
        <div id="adminLoginAlert" class="mt-3 text-center small"></div>
    </div>

    <script>
        function handleAdminLogin(event) {
            event.preventDefault();
            const usernameInput = document.getElementById('adminUser').value.trim();
            const passwordInput = document.getElementById('adminPass').value.trim();
            const alertDiv = document.getElementById('adminLoginAlert');

            // بيانات الاعتماد الخاصة بك (يمكنك تغييرها هنا مباشرة أو ربطها بمتغيرات آمنة)
            const ADMIN_USERNAME = "ELMOHANDESGROUP"; // يقمد تغييرها لاسم المستخدم الذي تفضله
            const ADMIN_PASSWORD = "S@ndst0rm79sabry"; // كلمة المرور الخاصة بك

            if (usernameInput === ADMIN_USERNAME && passwordInput === ADMIN_PASSWORD) {
                alertDiv.innerHTML = '<span class="text-success fw-bold">تم التحقق بنجاح! جاري توجيهك...</span>';
                
                // حفظ حالة تسجيل الدخول للمدير في المتصفح
                localStorage.setItem('isAdminLoggedIn', 'true');

                // التوجيه للوحة التحكم الرئيسية بعد ثانية
                setTimeout(() => {
                    window.location.href = 'admin-dashboard.html';
                }, 800);
            } else {
                alertDiv.innerHTML = '<span class="text-danger fw-bold">اسم المستخدم أو كلمة المرور غير صحيحة!</span>';
            }
        }
    </script>
</body>
</html>
