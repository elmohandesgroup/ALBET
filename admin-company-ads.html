<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة إعلانات الشركات - متجر البيت (سريع ومنظم)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 font-sans">

    <div class="max-w-4xl mx-auto p-6 my-8 space-y-6">
        
        <!-- رأس الصفحة والعدادات -->
        <div class="bg-white rounded-2xl p-6 shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h2 class="text-xl font-bold text-orange-600">إدارة إعلانات الشركات (متجر البيت)</h2>
                <p class="text-xs text-gray-500 mt-1">رفع الصور لـ Storage، ربط دقيق بالأقسام الرئيسية والفرعية من قاعدة البيانات.</p>
            </div>
            <div class="flex gap-3">
                <div class="bg-orange-50 border border-orange-200 px-4 py-2 rounded-xl text-center">
                    <span class="block text-xs text-orange-600 font-bold">نشط حالياً</span>
                    <span id="activeCount" class="text-lg font-bold text-gray-800">0</span>
                </div>
                <div class="bg-red-50 border border-red-200 px-4 py-2 rounded-xl text-center">
                    <span class="block text-xs text-red-600 font-bold">منتهي</span>
                    <span id="expiredCount" class="text-lg font-bold text-gray-800">0</span>
                </div>
            </div>
            <a href="admin-dashboard.html" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-xl font-bold text-xs transition-all">العودة للوحة التحكم</a>
        </div>

        <!-- نموذج الإضافة / التعديل -->
        <div class="bg-white rounded-2xl p-6 shadow-xl">
            <h3 id="formTitle" class="text-base font-bold text-gray-800 mb-4 border-b pb-2">إضافة بانر جديد</h3>
            <form id="companyAdForm" class="space-y-4">
                <input type="hidden" id="editAdId">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">اسم تعريفي للإعلان</label>
                        <input type="text" id="compTitle" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-orange-500" placeholder="مثال: بانر قسم الثلاجات" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">مدة الصلاحية بالأيام</label>
                        <input type="number" id="compDuration" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-orange-500" value="7" min="1" required>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">نوع العرض</label>
                        <select id="compDisplayType" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-orange-500">
                            <option value="slider">متحرك (Slider)</option>
                            <option value="static">ثابت (صورة واحدة)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">مكان الظهور</label>
                        <select id="compPosition" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-orange-500">
                            <option value="above">فوق شريط الأقسام</option>
                            <option value="below">تحت شريط الأقسام</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1">الصفحة العامة المستهدفة</label>
                        <select id="compPage" class="w-full border rounded-xl p-2.5 text-sm outline-none focus:ring-2 focus:ring-orange-500" onchange="handlePageSelectionChange()">
                            <option value="index.html">الصفحة الرئيسية (index.html)</option>
                            <option value="categories.html">صفحة الأقسام العامة (categories.html)</option>
                            <option value="custom_department">تخصيص لقسم رئيسي أو فرعي محدد ↓</option>
                        </select>
                    </div>
                </div>

                <!-- القائمتان المخصوصتان للأقسام الرئيسية والفرعية مجلوبتان من قاعدة البيانات بدقة -->
                <div id="departmentSelectionBox" class="grid grid-cols-1 md:grid-cols-2 gap-4 p-4 bg-orange-50/50 rounded-2xl border border-orange-100 hidden">
                    <div>
                        <label class="block text-xs font-bold text-orange-800 mb-1">القسم الرئيسي</label>
                        <select id="compMainCategory" class="w-full border rounded-xl p-2.5 text-sm outline-none bg-white focus:ring-2 focus:ring-orange-500" onchange="fetchSubCategoriesFromDB()">
                            <option value="">-- اختر القسم الرئيسي --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-orange-800 mb-1">القسم الفرعي (اختياري لكل صفحة منفصلة)</label>
                        <select id="compSubCategory" class="w-full border rounded-xl p-2.5 text-sm outline-none bg-white focus:ring-2 focus:ring-orange-500">
                            <option value="">-- عام لكل القسم الرئيسي --</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">رفع الصور (تترفع لـ Storage مباشرة - متعدد)</label>
                    <input type="file" id="compImagesFile" class="w-full border rounded-xl p-2 text-sm outline-none bg-gray-50" accept="image/webp, image/png, image/jpeg" multiple>
                    <!-- منطقة المعاينة -->
                    <div id="imagePreviewContainer" class="flex gap-3 mt-3 flex-wrap"></div>
                </div>

                <div class="flex gap-2">
                    <button type="submit" id="submitBtn" class="flex-1 bg-orange-600 text-white py-3 rounded-xl font-bold text-sm hover:bg-orange-700 transition-all shadow-md">
                        حفظ ونشر البنر
                    </button>
                    <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden bg-gray-300 text-gray-700 px-6 py-3 rounded-xl font-bold text-sm hover:bg-gray-400 transition-all">
                        إلغاء
                    </button>
                </div>
            </form>
        </div>

        <!-- جدول المتابعة والعدادات -->
        <div class="bg-white rounded-2xl p-6 shadow-xl">
            <h3 class="text-base font-bold text-gray-800 mb-4 border-b pb-2">البنرات النشطة والمتابعة</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                    <thead>
                        <tr class="bg-gray-100 text-gray-700 text-xs">
                            <th class="p-3">الإعلان</th>
                            <th class="p-3">الهدف (الصفحة أو القسم)</th>
                            <th class="p-3">الوقت المتبقي</th>
                            <th class="p-3">الإجراء</th>
                        </tr>
                    </thead>
                    <tbody id="adsTableBody">
                        <!-- بيانات جدولية -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = 'https://usaqiylvcnmccgpnxwaq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_he-h5ysxqK0VLujbtAXcUg_K5qf1rSB';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentImagesList = [];
        let allSubCategoriesCache = [];

        // 1. جلب الأقسام الرئيسية مباشرة من قاعدة البيانات
        async function loadMainCategories() {
            try {
                const { data: categories, error } = await supabaseClient.from('categories').select('*');
                if (error || !categories) return;

                const mainSelect = document.getElementById('compMainCategory');
                mainSelect.innerHTML = '<option value="">-- اختر القسم الرئيسي --</option>';

                categories.forEach(cat => {
                    let option = document.createElement('option');
                    option.value = cat.id; 
                    option.textContent = cat.name || cat.title;
                    mainSelect.appendChild(option);
                });
            } catch (err) {
                console.log("Main categories error:", err);
            }
        }

        // 2. جلب الأقسام الفرعية ديناميكياً بناءً على القسم الرئيسي المختار
        async function fetchSubCategoriesFromDB(selectedSubId = null) {
            const mainCatId = document.getElementById('compMainCategory').value;
            const subSelect = document.getElementById('compSubCategory');
            
            subSelect.innerHTML = '<option value="">-- عام لكل القسم الرئيسي --</option>';
            if (!mainCatId) return;

            try {
                let subcategories = [];
                
                // محاولة جلب الأقسام الفرعية من الجداول المحتملة
                const { data: d1 } = await supabaseClient.from('subcategories').select('*').eq('category_id', mainCatId);
                if (d1 && d1.length > 0) {
                    subcategories = d1;
                } else {
                    const { data: d2 } = await supabaseClient.from('sub_categories').select('*').eq('category_id', mainCatId);
                    if (d2 && d2.length > 0) {
                        subcategories = d2;
                    } else {
                        // محاولة جلب كل الأقسام الفرعية وفلترتها برمجياً لو حقل الربط باسم مختلف
                        const { data: d3 } = await supabaseClient.from('subcategories').select('*');
                        if (d3) {
                            subcategories = d3.filter(s => String(s.category_id || s.main_category_id || s.cat_id) === String(mainCatId));
                        } else {
                            const { data: d4 } = await supabaseClient.from('sub_categories').select('*');
                            if (d4) {
                                subcategories = d4.filter(s => String(s.category_id || s.main_category_id || s.cat_id) === String(mainCatId));
                            }
                        }
                    }
                }

                allSubCategoriesCache = subcategories;
                subcategories.forEach(sub => {
                    let option = document.createElement('option');
                    option.value = sub.id;
                    option.textContent = sub.name || sub.title;
                    if (selectedSubId && String(sub.id) === String(selectedSubId)) {
                        option.selected = true;
                    }
                    subSelect.appendChild(option);
                });
            } catch (err) {
                console.log("Subcategories fetch error:", err);
            }
        }

        // إظهار أو إخفاء صندوق اختيار الأقسام
        function handlePageSelectionChange() {
            const pageVal = document.getElementById('compPage').value;
            const deptBox = document.getElementById('departmentSelectionBox');
            if (pageVal === 'custom_department') {
                deptBox.classList.remove('hidden');
            } else {
                deptBox.classList.add('hidden');
                document.getElementById('compMainCategory').value = '';
                document.getElementById('compSubCategory').innerHTML = '<option value="">-- عام لكل القسم الرئيسي --</option>';
            }
        }

        document.getElementById('compImagesFile').addEventListener('change', (e) => {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            for (let file of files) {
                currentImagesList.push({
                    file: file,
                    url: URL.createObjectURL(file),
                    isNew: true
                });
            }
            renderPreviews();
            e.target.value = '';
        });

        function renderPreviews() {
            const previewContainer = document.getElementById('imagePreviewContainer');
            previewContainer.innerHTML = '';

            currentImagesList.forEach((item, index) => {
                const imgSrc = item.isNew ? item.url : item;
                previewContainer.innerHTML += `
                    <div class="relative group w-20 h-20">
                        <img src="${imgSrc}" class="w-full h-full object-cover rounded-xl border shadow-sm">
                        <button type="button" onclick="removeImage(${index})" class="absolute -top-2 -left-2 bg-red-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold shadow-md hover:bg-red-700 transition-all">×</button>
                    </div>
                `;
            });
        }

        function removeImage(index) {
            currentImagesList.splice(index, 1);
            renderPreviews();
        }

        async function fetchAds() {
            const { data, error } = await supabaseClient
                .from('featured_companies')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) return;

            const tbody = document.getElementById('adsTableBody');
            tbody.innerHTML = '';
            let active = 0, expired = 0;
            const now = new Date();

            data.forEach(ad => {
                const createdAt = new Date(ad.created_at || Date.now());
                const durationDays = ad.duration || 7;
                const expirationDate = new Date(createdAt.getTime() + (durationDays * 24 * 60 * 60 * 1000));
                const diffTime = expirationDate - now;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                let timeText = diffDays > 0 ? `<span class="bg-emerald-100 text-emerald-700 px-2 py-1 rounded-lg text-xs font-bold">باقي ${diffDays} يوم</span>` : `<span class="bg-red-100 text-red-700 px-2 py-1 rounded-lg text-xs font-bold">منتهي</span>`;
                if (diffDays > 0) active++; else expired++;

                tbody.innerHTML += `
                    <tr class="border-b">
                        <td class="p-3 font-bold text-gray-800">${ad.title}</td>
                        <td class="p-3 text-xs text-gray-600">${ad.page_target}</td>
                        <td class="p-3">${timeText}</td>
                        <td class="p-3 flex gap-2">
                            <button onclick='editAd(${JSON.stringify(ad)})' class="text-blue-500 hover:text-blue-700 font-bold text-xs">تعديل</button>
                            <button onclick="deleteAd(${ad.id})" class="text-red-500 hover:text-red-700 font-bold text-xs">حذف</button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('activeCount').innerText = active;
            document.getElementById('expiredCount').innerText = expired;
        }

        document.getElementById('companyAdForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('editAdId').value;
            const title = document.getElementById('compTitle').value;
            const duration = parseInt(document.getElementById('compDuration').value);
            const display_type = document.getElementById('compDisplayType').value;
            const position = document.getElementById('compPosition').value;
            
            const pageSelection = document.getElementById('compPage').value;
            let page_target = pageSelection;

            if (pageSelection === 'custom_department') {
                const mainCat = document.getElementById('compMainCategory').value;
                const subCat = document.getElementById('compSubCategory').value;
                if (!mainCat) {
                    alert('برجاء اختيار القسم الرئيسي!');
                    return;
                }
                page_target = subCat ? `subcat_${subCat}` : `cat_${mainCat}`;
            }

            if (currentImagesList.length === 0) {
                alert('يجب إرفاق صورة واحدة على الأقل!');
                return;
            }

            let finalImageUrls = [];
            for (let item of currentImagesList) {
                if (item.isNew) {
                    const fileExt = item.file.name.split('.').pop();
                    const fileName = `banners/${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
                    
                    const { data: uploadData, error: uploadError } = await supabaseClient.storage
                        .from('site-images')
                        .upload(fileName, item.file);

                    if (uploadError) {
                        alert('خطأ في رفع الصورة: ' + uploadError.message);
                        return;
                    }

                    const { data: publicUrlData } = supabaseClient.storage
                        .from('site-images')
                        .getPublicUrl(fileName);

                    finalImageUrls.push(publicUrlData.publicUrl);
                } else {
                    finalImageUrls.push(item);
                }
            }

            const adData = { title, duration, display_type, position, page_target, images: finalImageUrls };

            let error;
            if (id) {
                const res = await supabaseClient.from('featured_companies').update(adData).eq('id', id);
                error = res.error;
            } else {
                adData.created_at = new Date();
                const res = await supabaseClient.from('featured_companies').insert([adData]);
                error = res.error;
            }

            if (error) {
                alert('خطأ أثناء الحفظ: ' + error.message);
            } else {
                alert('تم حفظ ونشر البنر بنجاح!');
                resetForm();
                fetchAds();
            }
        });

        async function editAd(ad) {
            document.getElementById('editAdId').value = ad.id;
            document.getElementById('compTitle').value = ad.title;
            document.getElementById('compDuration').value = ad.duration;
            document.getElementById('compDisplayType').value = ad.display_type;
            document.getElementById('compPosition').value = ad.position;
            
            if (ad.page_target && (ad.page_target.startsWith('cat_') || ad.page_target.startsWith('subcat_'))) {
                document.getElementById('compPage').value = 'custom_department';
                handlePageSelectionChange();

                if (ad.page_target.startsWith('cat_')) {
                    const catId = ad.page_target.replace('cat_', '');
                    document.getElementById('compMainCategory').value = catId;
                    await fetchSubCategoriesFromDB();
                } else if (ad.page_target.startsWith('subcat_')) {
                    const subId = ad.page_target.replace('subcat_', '');
                    const { data: subData } = await supabaseClient.from('subcategories').select('*').eq('id', subId).single();
                    if (subData) {
                        document.getElementById('compMainCategory').value = subData.category_id;
                        await fetchSubCategoriesFromDB(subId);
                    }
                }
            } else {
                document.getElementById('compPage').value = ad.page_target || 'index.html';
                handlePageSelectionChange();
            }
            
            currentImagesList = Array.isArray(ad.images) ? [...ad.images] : [];
            renderPreviews();
            
            document.getElementById('formTitle').innerText = 'تعديل البنر';
            document.getElementById('submitBtn').innerText = 'تحديث البنر';
            document.getElementById('cancelEditBtn').classList.remove('hidden');

            window.scrollTo({ top: { top: 0, behavior: 'smooth' } });
        }

        function resetForm() {
            document.getElementById('companyAdForm').reset();
            document.getElementById('editAdId').value = '';
            document.getElementById('formTitle').innerText = 'إضافة بانر جديد';
            document.getElementById('submitBtn').innerText = 'حفظ ونشر البنر';
            document.getElementById('cancelEditBtn').classList.add('hidden');
            document.getElementById('departmentSelectionBox').classList.add('hidden');
            document.getElementById('imagePreviewContainer').innerHTML = '';
            currentImagesList = [];
        }

        async function deleteAd(id) {
            if (confirm('هل أنت متأكد من حذف هذا البنر؟')) {
                await supabaseClient.from('featured_companies').delete().eq('id', id);
                fetchAds();
            }
        }

        // تشغيل جلب الأقسام الرئيسية والجدول فور فتح الصفحة
        loadMainCategories();
        fetchAds();
    </script>
</body>
</html>
