<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة إعلانات الشركات - متجر البيت</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 font-sans">

    <div class="max-w-3xl mx-auto p-6 my-8 bg-white rounded-2xl shadow-xl">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h2 class="text-xl font-bold text-orange-600">إضافة إعلان شركة مميزة جديد</h2>
            <a href="admin-dashboard.html" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded-xl font-bold transition-all">العودة للوحة التحكم</a>
        </div>

        <form id="companyAdForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">اسم الشركة أو العنوان</label>
                <input type="text" id="compTitle" class="w-full border rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-orange-500 outline-none" placeholder="مثال: عروض الأجهزة المنزلية الكبرى" required>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">وصف العرض أو الخدمات</label>
                <textarea id="compDesc" class="w-full border rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-orange-500 outline-none" placeholder="تفاصيل الضمان والتوصيل..." rows="3" required></textarea>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">رقم الواتساب للتواصل</label>
                <input type="text" id="compPhone" class="w-full border rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-orange-500 outline-none" placeholder="201227802300" required>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">روابط الصور (مفصولة بفواصل للسلايدر المتحرك)</label>
                <input type="text" id="compImages" class="w-full border rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-orange-500 outline-none" placeholder="logo512.png, logo192.png" required>
            </div>

            <button type="submit" class="w-full bg-orange-600 text-white py-3 rounded-xl font-bold text-sm hover:bg-orange-700 transition-all shadow-md">
                حفظ ونشر الإعلان في الصفحة الرئيسية
            </button>
        </form>
    </div>

    <script>
        // إعداد اتصال Supabase (تأكد من مطابقة المفاتيح المستخدمة في الموقع)
        const SUPABASE_URL = 'https://your-supabase-url.supabase.co';
        const SUPABASE_ANON_KEY = 'your-supabase-anon-key';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('companyAdForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('compTitle').value;
            const description = document.getElementById('compDesc').value;
            const phone = document.getElementById('compPhone').value;
            const imagesInput = document.getElementById('compImages').value;
            
            // تحويل الروابط لمصفوفة عشان السلايدر يقرأها
            const images = imagesInput.split(',').map(img => img.trim());

            const { data, error } = await supabaseClient
                .from('featured_companies')
                .insert([{ title, description, phone, images }]);

            if (error) {
                alert('حدث خطأ أثناء الحفظ: ' + error.message);
            } else {
                alert('تم إضافة إعلان الشركة بنجاح!');
                document.getElementById('companyAdForm').reset();
            }
        });
    </script>
</body>
</html>
