<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متجر البيت - الأفضل دائماً</title>
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-34S913WKK2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-34S913WKK2');
    </script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ea580c">
    <link rel="apple-touch-icon" href="logo192.png">

    <!-- Google Fonts (Cairo) & Animations -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8f9fa;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes hintScroll {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(-8px); }
        }
        .scroll-hint { animation: hintScroll 2s infinite ease-in-out; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

    <!-- الهيدر الرئيسي -->
    <header class="bg-white shadow-sm sticky top-0 z-50 px-4 py-3.5">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button id="open-menu-btn" class="p-1.5 text-gray-700 hover:text-orange-600 transition-colors focus:outline-none" aria-label="فتح القائمة">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
                <a href="index.html" class="flex items-center">
                    <img src="logo192.png" alt="متجر البيت" class="w-12 h-12 object-contain rounded-xl shadow-sm border border-gray-100 bg-white p-1">
                </a>
            </div>

            <div class="text-center flex-1 mx-2">
                <a href="index.html" class="block">
                    <h1 class="text-lg md:text-2xl font-black text-orange-600 leading-tight">متجر البيت</h1>
                    <p class="text-[11px] md:text-xs text-gray-500 font-medium">الأفضل دائماً</p>
                </a>
            </div>
            
            <div class="flex items-center">
                <a href="add-ad.html" class="bg-orange-600 hover:bg-orange-700 text-white px-3.5 py-2 rounded-xl text-xs md:text-sm font-bold transition-all shadow-sm flex items-center gap-1.5 whitespace-nowrap">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    <span>أضف إعلانك</span>
                </a>
            </div>
        </div>
    </header>

    <!-- القائمة الجانبية -->
    <div id="side-menu" class="fixed inset-0 z-50 hidden">
        <div id="menu-overlay" class="absolute inset-0 bg-black/50 transition-opacity"></div>
        <div class="absolute right-0 top-0 bottom-0 w-80 bg-white shadow-2xl p-5 flex flex-col justify-between transform transition-transform duration-300 translate-x-full overflow-y-auto" id="menu-content">
            <div>
                <div class="flex items-center justify-between pb-4 border-b mb-4">
                    <div class="flex items-center gap-2">
                        <img src="logo192.png" alt="متجر البيت" class="w-10 h-10 object-contain">
                        <span class="font-black text-orange-600 text-lg">متجر البيت</span>
                    </div>
                    <button id="close-menu-btn" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
                </div>
                
                <nav class="space-y-2">
                    <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-bold text-gray-700 hover:bg-orange-50 hover:text-orange-600 transition-colors">الرئيسية</a>
                    <a href="categories.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-bold text-gray-700 hover:bg-orange-50 hover:text-orange-600 transition-colors">الأقسام</a>
                    <a href="add-ad.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-bold text-orange-600 bg-orange-50 transition-colors">أضف إعلانك الجديد</a>

                    <div class="pt-2 pb-1 text-xs font-bold text-gray-400 px-3">سياسات المتجر</div>
                    <a href="privacy.html" class="block px-3 py-2 rounded-xl text-xs font-medium text-gray-600 hover:bg-gray-100">سياسة الاستخدام والخصوصية</a>
                    <a href="terms.html" class="block px-3 py-2 rounded-xl text-xs font-medium text-gray-600 hover:bg-gray-100">الشروط والأحكام</a>
                </nav>
            </div>
            <div class="text-center text-[11px] text-gray-400 pt-4 border-t">
                جميع الحقوق محفوظة &copy; متجر البيت 2026
            </div>
        </div>
    </div>

    <!-- محتوى المتجر الرئيسي -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
        <div id="topBannerAds" class="w-full"></div>

        <section class="space-y-3">
            <div class="flex justify-between items-center">
                <h3 id="section-bar-title" class="font-bold text-gray-800 text-base">الأقسام</h3>
                <a href="categories.html" class="text-xs text-orange-600 font-semibold hover:underline">عرض الكل</a>
            </div>
            <!-- شريط الأقسام التفاعلي (التسلسل السلس) -->
            <div id="categories-container" class="flex gap-4 overflow-x-auto no-scrollbar pb-2">
                <div class="text-xs text-gray-400">جاري تحميل الأقسام...</div>
            </div>
        </section>

        <div id="bottomBannerAds" class="w-full"></div>

        <section class="space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-gray-800 text-base">أحدث الإعلانات</h3>
                <span id="ads-section-title" class="text-xs text-gray-400">متجدد باستمرار</span>
            </div>
            <div id="ads-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="text-xs text-gray-400 p-4">جاري تحميل الإعلانات...</div>
            </div>
        </section>
    </main>

    <script>
        const openMenuBtn = document.getElementById('open-menu-btn');
        const closeMenuBtn = document.getElementById('close-menu-btn');
        const sideMenu = document.getElementById('side-menu');
        const menuOverlay = document.getElementById('menu-overlay');
        const menuContent = document.getElementById('menu-content');

        function openMenu() {
            sideMenu.classList.remove('hidden');
            setTimeout(() => { menuContent.classList.remove('translate-x-full'); }, 10);
        }
        function closeMenu() {
            menuContent.classList.add('translate-x-full');
            setTimeout(() => { sideMenu.classList.add('hidden'); }, 300);
        }

        if (openMenuBtn) openMenuBtn.addEventListener('click', openMenu);
        if (closeMenuBtn) closeMenuBtn.addEventListener('click', closeMenu);
        if (menuOverlay) menuOverlay.addEventListener('click', closeMenu);

        const SUPABASE_URL = 'https://usaqiylvcnmccgpnxwaq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_he-h5ysxqK0VLujbtAXcUg_K5qf1rSB';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    reg.update();
                }).catch(err => console.log(err));
            });
        }

        let allCategoriesData = [];

        // 1. جلب الأقسام الرئيسية وعرضها في الشريط
        async function fetchCategories() {
            const container = document.getElementById('categories-container');
            const titleEl = document.getElementById('section-bar-title');
            if (!container) return;

            if (titleEl) titleEl.innerText = "الأقسام";

            try {
                const { data: categories, error } = await db
                    .from('categories')
                    .select('*');

                if (error) throw error;
                allCategoriesData = categories || [];

                const mainCategories = allCategoriesData.filter(c => !c.parent_id);

                if (mainCategories.length === 0) {
                    container.innerHTML = '<div class="text-xs text-gray-400 p-2">لا توجد أقسام مضافة حالياً.</div>';
                    return;
                }

                container.innerHTML = '';
                mainCategories.forEach((cat, index) => {
                    const iconSrc = cat.image_url ? cat.image_url : 'logo192.png';
                    const hintClass = index === 0 ? 'scroll-hint' : '';
                    const catCard = `
                        <button onclick="handleMainCategoryClick('${cat.id}', '${cat.name}')" class="flex flex-col items-center justify-center bg-white border border-gray-100 rounded-2xl p-3 w-28 flex-shrink-0 shadow-sm hover:border-orange-500 hover:shadow-md transition-all text-center cursor-pointer ${hintClass}">
                            <div class="w-16 h-16 bg-orange-50/30 rounded-full flex items-center justify-center mb-2 overflow-hidden shadow-inner">
                                <img src="${iconSrc}" alt="${cat.name}" class="w-full h-full object-cover rounded-full">
                            </div>
                            <span class="text-xs font-bold text-gray-700 truncate w-full">${cat.name}</span>
                        </button>
                    `;
                    container.innerHTML += catCard;
                });
            } catch (err) {
                console.error('خطأ في جلب الأقسام:', err.message);
                container.innerHTML = '<div class="text-xs text-red-400 p-2">تعذر تحميل الأقسام.</div>';
            }
        }

        // 2. عند الضغط على قسم رئيسي: تحديث الشريط بعرض أقسامه الفرعية بسلاسة
        function handleMainCategoryClick(catId, catName) {
            const container = document.getElementById('categories-container');
            const titleEl = document.getElementById('section-bar-title');
            if (!container) return;

            if (titleEl) titleEl.innerText = `أقسام: ${catName}`;

            const subCategories = allCategoriesData.filter(c => c.parent_id == catId);

            // زر الرجوع للقائمة الرئيسية
            let html = `
                <button onclick="fetchCategories(); fetchAds();" class="flex flex-col items-center justify-center bg-orange-50 border border-orange-200 rounded-2xl p-3 w-28 flex-shrink-0 shadow-sm hover:bg-orange-100 transition-all text-center cursor-pointer">
                    <div class="w-16 h-16 bg-orange-600 text-white rounded-full flex items-center justify-center mb-2 shadow-inner text-xl font-black">
                        ↺
                    </div>
                    <span class="text-xs font-bold text-orange-700 truncate w-full">الرئيسية</span>
                </button>
            `;

            if (subCategories.length === 0) {
                // لو مفيش أقسام فرعية، فتح صفحة القسم مباشرة
                window.location.href = `section.html?cat=${encodeURIComponent(catName)}`;
                return;
            }

            subCategories.forEach(sub => {
                const iconSrc = sub.image_url ? sub.image_url : 'logo192.png';
                // الضغط على القسم الفرعي الأخير يفتح صفحة section.html المخصصة له
                html += `
                    <a href="section.html?cat=${encodeURIComponent(catName)}&sub=${encodeURIComponent(sub.name)}" class="flex flex-col items-center justify-center bg-white border border-gray-100 rounded-2xl p-3 w-28 flex-shrink-0 shadow-sm hover:border-orange-500 hover:shadow-md transition-all text-center">
                        <div class="w-16 h-16 bg-orange-50/30 rounded-full flex items-center justify-center mb-2 overflow-hidden shadow-inner">
                            <img src="${iconSrc}" alt="${sub.name}" class="w-full h-full object-cover rounded-full">
                        </div>
                        <span class="text-xs font-bold text-gray-700 truncate w-full">${sub.name}</span>
                    </a>
                `;
            });

            container.innerHTML = html;
            // عرض إعلانات القسم الرئيسي مؤقتاً في الأسفل حتى يضغط على القسم الفرعي النهائي
            fetchAdsByCategory(catName);
        }

        async function fetchAds(categoryFilter = null) {
            const container = document.getElementById('ads-container');
            const adsTitle = document.getElementById('ads-section-title');
            if (!container) return;
            
            try {
                const { data: ads, error } = await db
                    .from('ads')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                let filteredAds = ads || [];
                if (categoryFilter) {
                    filteredAds = ads.filter(ad => ad.category === categoryFilter || ad.subcategory === categoryFilter);
                    if (adsTitle) adsTitle.innerText = `إعلانات قسم: ${categoryFilter}`;
                } else {
                    if (adsTitle) adsTitle.innerText = 'متجدد باستمرار';
                }

                if (!filteredAds || filteredAds.length === 0) {
                    container.innerHTML = '<div class="text-xs text-gray-400 p-4 col-span-full text-center">لا توجد إعلانات مضافة حالياً في هذا القسم.</div>';
                    return;
                }

                container.innerHTML = ''; 
                filteredAds.forEach(ad => {
                    const mainImage = (ad.images && ad.images.length > 0) ? ad.images[0] : (ad.image_url || 'logo192.png');
                    const adCard = `
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 flex flex-col justify-between">
                            <div>
                                <div class="relative rounded-xl overflow-hidden mb-3 bg-gray-100 h-48 md:h-64">
                                    <span class="absolute top-2 right-2 bg-emerald-500 text-white text-[10px] font-bold px-2.5 py-1 rounded-full shadow z-10">${ad.condition || 'جديد'}</span>
                                    <img src="${mainImage}" alt="${ad.title}" class="w-full h-full object-cover">
                                </div>
                                <div class="space-y-2">
                                    <div class="flex justify-between items-start">
                                        <h4 class="font-bold text-gray-800 text-sm md:text-base line-clamp-1">${ad.title}</h4>
                                        <span class="text-orange-600 font-black text-sm md:text-base whitespace-nowrap">${ad.price ? ad.price + ' جنيه' : 'السعر عند الاتصال'}</span>
                                    </div>
                                    <p class="text-xs text-gray-500 line-clamp-2">${ad.description || ''}</p>
                                </div>
                            </div>
                            <div class="mt-4 pt-3 border-t border-gray-50">
                                <a href="ad-details.html?id=${ad.id}" class="w-full bg-orange-600 hover:bg-orange-700 text-white py-2.5 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 shadow-sm">
                                    <span>عرض تفاصيل الإعلان</span>
                                </a>
                            </div>
                        </div>
                    `;
                    container.innerHTML += adCard;
                });
            } catch (err) {
                console.error('خطأ في جلب الإعلانات:', err.message);
                container.innerHTML = '<div class="text-xs text-red-400 p-4 col-span-full text-center">تعذر تحميل الإعلانات.</div>';
            }
        }

        function fetchAdsByCategory(catName) {
            fetchAds(catName);
        }

        function renderMediaElement(url, title) {
            if (!url) return '';
            const lower = url.toLowerCase();
            if (lower.includes('data:video') || lower.endsWith('.mp4') || lower.endsWith('.webm')) {
                return `<video src="${url}" autoplay muted loop playsinline class="w-full h-full object-cover"></video>`;
            }
            return `<img src="${url}" alt="${title || 'إعلان مميز'}" class="w-full h-full object-cover">`;
        }

        function setupSlider(containerId, mediaArray) {
            const container = document.getElementById(containerId);
            if (!container || mediaArray.length === 0) return;

            let slidesHtml = '';
            mediaArray.forEach((media, index) => {
                slidesHtml += `
                    <div class="absolute inset-0 transition-opacity duration-700 ease-in-out ${index === 0 ? 'opacity-100 z-10' : 'opacity-0 z-0'} ${containerId}-slide">
                        <div class="w-full h-44 sm:h-64 md:h-80 lg:h-96 rounded-2xl overflow-hidden shadow-sm bg-gray-100 relative">
                            ${renderMediaElement(media.url, media.title)}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="relative w-full h-44 sm:h-64 md:h-80 lg:h-96 overflow-hidden rounded-2xl shadow-sm">
                    ${slidesHtml}
                </div>
            `;

            if (mediaArray.length > 1) {
                let currentIdx = 0;
                const slides = container.querySelectorAll(`.${containerId}-slide`);
                setInterval(() => {
                    slides[currentIdx].classList.remove('opacity-100', 'z-10');
                    slides[currentIdx].classList.add('opacity-0', 'z-0');
                    currentIdx = (currentIdx + 1) % slides.length;
                    slides[currentIdx].classList.remove('opacity-0', 'z-0');
                    slides[currentIdx].classList.add('opacity-100', 'z-10');
                }, 3500);
            }
        }

        async function fetchBannerAds() {
            try {
                const { data: banners, error } = await db
                    .from('featured_companies')
                    .select('*')
                    .or('page_target.eq.index.html,page_target.eq.home');

                if (error || !banners) return;
                
                const topBanners = banners.filter(b => b.position === 'above');
                let allTopMedia = [];
                topBanners.forEach(banner => {
                    if (banner.images && banner.images.length > 0) {
                        banner.images.forEach(imgUrl => {
                            allTopMedia.push({ url: imgUrl, title: banner.title });
                        });
                    }
                });
                setupSlider('topBannerAds', allTopMedia);

                const bottomBanners = banners.filter(b => b.position === 'below');
                let allBottomMedia = [];
                bottomBanners.forEach(banner => {
                    if (banner.images && banner.images.length > 0) {
                        banner.images.forEach(imgUrl => {
                            allBottomMedia.push({ url: imgUrl, title: banner.title });
                        });
                    }
                });
                setupSlider('bottomBannerAds', allBottomMedia);

            } catch (e) {
                console.log('خطأ في جلب البانرات:', e);
            }
        }

        fetchCategories();
        fetchAds();
        fetchBannerAds();
    </script>
    <script src="location-filter.js"></script>
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
