<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متجر البيت - الأفضل دائماً</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Google Fonts (Cairo) -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8f9fa;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

    <!-- الهيدر الرئيسي -->
    <header class="bg-white shadow-sm sticky top-0 z-50 px-4 py-3.5">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button id="open-menu-btn" class="p-1.5 text-gray-700 hover:text-orange-600 transition-colors focus:outline-none" aria-label="فتح القائمة">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
                <a href="index.html" class="flex items-center">
                    <img src="logo192.png" alt="متجر البيت" class="w-12 h-12 object-contain rounded-xl shadow-sm border border-gray-100 bg-white p-1">
                </a>
            </div>

            <div class="text-center flex-1 mx-2">
                <a href="index.html" class="block">
                    <h1 class="text-lg md:text-2xl font-black text-orange-600 leading-tight">متجر البيت</h1>
                    <p class="text-[11px] md:text-xs text-gray-500 font-medium">الأفضل دائماً</p>
                </a>
            </div>

            <div class="flex items-center">
                <a href="add-ad.html" class="bg-orange-600 hover:bg-orange-700 text-white px-3.5 py-2 rounded-xl text-xs md:text-sm font-bold transition-all shadow-sm flex items-center gap-1.5 whitespace-nowrap">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    <span>أضف إعلانك</span>
                </a>
            </div>
        </div>
    </header>

    <!-- القائمة الجانبية (Drawer Menu) -->
    <div id="side-menu" class="fixed inset-0 z-50 hidden">
        <div id="menu-overlay" class="absolute inset-0 bg-black/50 transition-opacity"></div>
        <div class="absolute right-0 top-0 bottom-0 w-80 bg-white shadow-2xl p-5 flex flex-col justify-between transform transition-transform duration-300 translate-x-full overflow-y-auto" id="menu-content">
            <div>
                <div class="flex items-center justify-between pb-4 border-b mb-4">
                    <div class="flex items-center gap-2">
                        <img src="logo192.png" alt="متجر البيت" class="w-10 h-10 object-contain">
                        <span class="font-black text-orange-600 text-lg">متجر البيت</span>
                    </div>
                    <button id="close-menu-btn" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
                </div>
                
                <nav class="space-y-2">
                    <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-bold text-orange-600 bg-orange-50 transition-colors">الرئيسية</a>
                    <a href="categories.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-bold text-gray-700 hover:bg-orange-50 hover:text-orange-600 transition-colors">الأقسام</a>
                    <a href="add-ad.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-bold text-gray-700 hover:bg-orange-50 hover:text-orange-600 transition-colors">أضف إعلانك الجديد</a>
                    
                    <button id="menuInstallBtn" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-bold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 transition-colors text-right">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                        </svg>
                        <span>تثبيت التطبيق على جهازك</span>
                    </button>

                    <div class="pt-2 pb-1 text-xs font-bold text-gray-400 px-3">سياسات المتجر</div>
                    <a href="privacy.html" class="block px-3 py-2 rounded-xl text-xs font-medium text-gray-600 hover:bg-gray-100">سياسة الاستخدام والخصوصية</a>
                    <a href="terms.html" class="block px-3 py-2 rounded-xl text-xs font-medium text-gray-600 hover:bg-gray-100">الشروط والأحكام</a>
                </nav>
            </div>
            <div class="text-center text-[11px] text-gray-400 pt-4 border-t">
                جميع الحقوق محفوظة &copy; متجر البيت 2026
            </div>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
        
        <!-- بانر الشركات الكبرى (مع ارتفاع مرن للموبايل والكمبيوتر) -->
        <div id="topBannerAds" class="w-full"></div>

        <!-- الأقسام -->
        <section class="space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="font-bold text-gray-800 text-base md:text-lg">الأقسام</h2>
                <a href="categories.html" class="text-xs font-bold text-orange-600 hover:underline">عرض الكل</a>
            </div>
            <div id="categories-container" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 gap-3">
                <div class="col-span-full text-center py-6 text-gray-400 text-xs">جاري تحميل الأقسام...</div>
            </div>
        </section>

        <!-- بانر المنتجات الوسطي (بمرونة كاملة) -->
        <div id="middleBannerAds" class="w-full"></div>

        <!-- أحدث الإعلانات -->
        <section class="space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="font-bold text-gray-800 text-base md:text-lg">أحدث الإعلانات</h2>
                <span class="text-xs text-gray-400">متجدد باستمرار</span>
            </div>
            <div id="ads-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <div class="col-span-full text-center py-12 text-gray-400 text-sm">جاري تحميل الإعلانات...</div>
            </div>
        </section>
    </main>

    <!-- البرمجة والسكربتات -->
    <script>
        const SUPABASE_URL = 'https://usaqiylvcnmccgpnxwaq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_he-h5ysxqK0VLujbtAXcUg_K5qf1rSB';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // القائمة الجانبية
        const openMenuBtn = document.getElementById('open-menu-btn');
        const closeMenuBtn = document.getElementById('close-menu-btn');
        const sideMenu = document.getElementById('side-menu');
        const menuOverlay = document.getElementById('menu-overlay');
        const menuContent = document.getElementById('menu-content');

        function openMenu() {
            sideMenu.classList.remove('hidden');
            setTimeout(() => { menuContent.classList.remove('translate-x-full'); }, 10);
        }

        function closeMenu() {
            menuContent.classList.add('translate-x-full');
            setTimeout(() => { sideMenu.classList.add('hidden'); }, 300);
        }

        if (openMenuBtn) openMenuBtn.addEventListener('click', openMenu);
        if (closeMenuBtn) closeMenuBtn.addEventListener('click', closeMenu);
        if (menuOverlay) menuOverlay.addEventListener('click', closeMenu);

        // تثبيت التطبيق PWA
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        const menuInstallBtn = document.getElementById('menuInstallBtn');
        if (menuInstallBtn) {
            menuInstallBtn.addEventListener('click', async () => {
                closeMenu();
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    deferredPrompt = null;
                }
            });
        }

        // دالة السلايدر المرن للشاشات المختلفة
        function setupSlider(containerId, mediaArray) {
            const container = document.getElementById(containerId);
            if (!container || mediaArray.length === 0) return;

            let slidesHtml = '';
            let dotsHtml = '';

            mediaArray.forEach((media, index) => {
                slidesHtml += `
                    <div class="absolute inset-0 transition-opacity duration-700 ease-in-out ${index === 0 ? 'opacity-100 z-10' : 'opacity-0 z-0'} ${containerId}-slide">
                        <div class="w-full h-44 sm:h-64 md:h-80 lg:h-96 rounded-2xl overflow-hidden shadow-sm bg-gray-100 relative">
                            <img src="${media.url}" alt="${media.title || 'إعلان'}" class="w-full h-full object-cover">
                        </div>
                    </div>
                `;
                dotsHtml += `
                    <button class="w-2 h-2 rounded-full transition-all ${index === 0 ? 'bg-orange-600 w-4' : 'bg-white/70'} ${containerId}-dot" aria-label="شريحة"></button>
                `;
            });

            container.innerHTML = `
                <div class="relative w-full h-44 sm:h-64 md:h-80 lg:h-96 rounded-2xl shadow-sm">
                    ${slidesHtml}
                    <div class="absolute bottom-3 left-0 right-0 z-20 flex justify-center items-center gap-1.5">
                        ${dotsHtml}
                    </div>
                </div>
            `;

            if (mediaArray.length > 1) {
                let currentIdx = 0;
                const slides = container.querySelectorAll(`.${containerId}-slide`);
                const dots = container.querySelectorAll(`.${containerId}-dot`);

                setInterval(() => {
                    slides[currentIdx].classList.remove('opacity-100', 'z-10');
                    slides[currentIdx].classList.add('opacity-0', 'z-0');
                    if (dots[currentIdx]) {
                        dots[currentIdx].classList.remove('bg-orange-600', 'w-4');
                        dots[currentIdx].classList.add('bg-white/70');
                    }

                    currentIdx = (currentIdx + 1) % slides.length;

                    slides[currentIdx].classList.remove('opacity-0', 'z-0');
                    slides[currentIdx].classList.add('opacity-100', 'z-10');
                    if (dots[currentIdx]) {
                        dots[currentIdx].classList.remove('bg-white/70');
                        dots[currentIdx].classList.add('bg-orange-600', 'w-4');
                    }
                }, 3500);
            }
        }

        // جلب البانرات من Supabase
        async function fetchBanners() {
            try {
                const { data: banners, error } = await db.from('featured_companies').select('*');
                if (error || !banners) return;

                let topMedia = [];
                let middleMedia = [];

                banners.forEach(b => {
                    if (b.images && b.images.length > 0) {
                        b.images.forEach(img => {
                            if (b.position === 'above') topMedia.push({ url: img, title: b.title });
                            else middleMedia.push({ url: img, title: b.title });
                        });
                    }
                });

                if (topMedia.length > 0) setupSlider('topBannerAds', topMedia);
                if (middleMedia.length > 0) setupSlider('middleBannerAds', middleMedia);
            } catch (e) {
                console.log('خطأ في البانرات:', e);
            }
        }

        // جلب الأقسام
        async function fetchCategories() {
            const container = document.getElementById('categories-container');
            try {
                const { data: categories, error } = await db.from('categories').select('*').limit(8);
                if (error) throw error;
                if (!categories || categories.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-center py-4 text-gray-400 text-xs">لا توجد أقسام مضافة.</div>';
                    return;
                }
                container.innerHTML = '';
                categories.forEach(cat => {
                    const icon = cat.image_url ? cat.image_url : 'logo192.png';
                    container.innerHTML += `
                        <a href="category.html?id=${cat.id}" class="bg-white border border-gray-100 rounded-2xl p-2.5 flex flex-col items-center justify-center text-center shadow-sm hover:border-orange-500 transition-all group">
                            <div class="w-14 h-14 bg-orange-50 rounded-xl flex items-center justify-center mb-2 overflow-hidden border border-orange-100 group-hover:scale-105 transition-transform">
                                <img src="${icon}" alt="${cat.name}" class="w-full h-full object-cover">
                            </div>
                            <h3 class="font-bold text-gray-700 text-xs group-hover:text-orange-600 truncate w-full">${cat.name}</h3>
                        </a>
                    `;
                });
            } catch (err) {
                container.innerHTML = '<div class="col-span-full text-center py-4 text-red-400 text-xs">تعذر تحميل الأقسام</div>';
            }
        }

        // جلب أحدث الإعلانات
        async function fetchAds() {
            const container = document.getElementById('ads-container');
            try {
                const { data: ads, error } = await db.from('ads').select('*').order('created_at', { ascending: false }).limit(12);
                if (error) throw error;
                if (!ads || ads.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-center py-12 text-gray-400 text-sm">لا توجد إعلانات مضافة حالياً.</div>';
                    return;
                }
                container.innerHTML = '';
                ads.forEach(ad => {
                    const img = (ad.images && ad.images.length > 0) ? ad.images[0] : 'logo192.png';
                    container.innerHTML += `
                        <a href="ad-details.html?id=${ad.id}" class="bg-white border border-gray-100 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-all flex flex-col">
                            <div class="w-full h-48 bg-gray-100 overflow-hidden relative">
                                <img src="${img}" alt="${ad.title}" class="w-full h-full object-cover">
                            </div>
                            <div class="p-4 flex flex-col justify-between flex-1">
                                <h3 class="font-bold text-gray-800 text-sm mb-2 line-clamp-1">${ad.title}</h3>
                                <div class="text-orange-600 font-extrabold text-sm">${ad.price ? ad.price + ' ج.م' : ''}</div>
                            </div>
                        </a>
                    `;
                });
            } catch (err) {
                container.innerHTML = '<div class="col-span-full text-center py-12 text-red-400 text-sm">تعذر تحميل الإعلانات</div>';
            }
        }

        fetchBanners();
        fetchCategories();
        fetchAds();
    </script>
</body>
</html>
