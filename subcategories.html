<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الأقسام الفرعية - متجر البيت</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Google Fonts (Cairo) -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8f9fa;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

    <!-- الهيدر الرئيسي -->
    <header class="bg-white shadow-sm sticky top-0 z-50 px-4 py-3.5">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button id="open-menu-btn" class="p-1.5 text-gray-700 hover:text-orange-600 transition-colors focus:outline-none" aria-label="فتح القائمة">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
                <a href="index.html" class="flex items-center">
                    <img src="logo192.png" alt="متجر البيت" class="w-12 h-12 object-contain rounded-xl shadow-sm border border-gray-100 bg-white p-1">
                </a>
            </div>

            <div class="text-center flex-1 mx-2">
                <a href="index.html" class="block">
                    <h1 class="text-lg md:text-2xl font-black text-orange-600 leading-tight">متجر البيت</h1>
                    <p class="text-[11px] md:text-xs text-gray-500 font-medium">الأفضل دائماً</p>
                </a>
            </div>

            <div class="flex items-center">
                <a href="add-ad.html" class="bg-orange-600 hover:bg-orange-700 text-white px-3.5 py-2 rounded-xl text-xs md:text-sm font-bold transition-all shadow-sm flex items-center gap-1.5 whitespace-nowrap">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    <span>أضف إعلانك</span>
                </a>
            </div>
        </div>
    </header>

    <!-- القائمة الجانبية (Drawer Menu) -->
    <div id="side-menu" class="fixed inset-0 z-50 hidden">
        <div id="menu-overlay" class="absolute inset-0 bg-black/50 transition-opacity"></div>
        <div class="absolute right-0 top-0 bottom-0 w-80 bg-white shadow-2xl p-5 flex flex-col justify-between transform transition-transform duration-300 translate-x-full overflow-y-auto" id="menu-content">
            <div>
                <div class="flex items-center justify-between pb-4 border-b mb-4">
                    <div class="flex items-center gap-2">
                        <img src="logo192.png" alt="متجر البيت" class="w-10 h-10 object-contain">
                        <span class="font-black text-orange-600 text-lg">متجر البيت</span>
                    </div>
                    <button id="close-menu-btn" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
                </div>
                
                <nav class="space-y-2">
                    <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-bold text-gray-700 hover:bg-orange-50 hover:text-orange-600 transition-colors">الرئيسية</a>
                    <a href="sections.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-bold text-gray-700 hover:bg-orange-50 hover:text-orange-600 transition-colors">الأقسام الرئيسية</a>
                    <a href="add-ad.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-bold text-gray-700 hover:bg-orange-50 hover:text-orange-600 transition-colors">أضف إعلانك الجديد</a>
                </nav>
            </div>
        </div>
    </div>

    <!-- محتوى الصفحة -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
        
        <!-- عنوان القسم الرئيسي -->
        <div class="flex items-center justify-between border-b pb-4">
            <div>
                <h2 id="main-category-title" class="font-black text-gray-800 text-xl md:text-2xl">جاري تحميل القسم...</h2>
                <p class="text-xs text-gray-400 mt-1">اختر القسم الفرعي المناسب لتصفح الإعلانات والمنتجات</p>
            </div>
            <a href="sections.html" class="text-xs font-bold text-orange-600 bg-orange-50 px-3.5 py-2 rounded-xl border border-orange-100 hover:bg-orange-100 transition-colors">كل الأقسام</a>
        </div>

        <!-- 🌟 البنرات الدعائية (مساحة الربح الأساسية أثناء فترة الإعلانات المجانية) -->
        <div id="banners-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- سيتم جلب البنرات الدعائية هنا ديناميكياً -->
        </div>

        <!-- شبكة الأقسام الفرعية -->
        <div class="space-y-3 pt-2">
            <h3 class="font-black text-gray-800 text-base">الأقسام الفرعية المتاحة:</h3>
            <div id="subcategories-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                <div class="col-span-full text-center py-12 text-gray-400 text-sm">جاري جلب الأقسام الفرعية...</div>
            </div>
        </div>

    </main>

    <!-- البرمجة والربط بـ Supabase -->
    <script>
        const SUPABASE_URL = 'https://usaqiylvcnmccgpnxwaq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_he-h5ysxqK0VLujbtAXcUg_K5qf1rSB';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // القائمة الجانبية
        const openMenuBtn = document.getElementById('open-menu-btn');
        const closeMenuBtn = document.getElementById('close-menu-btn');
        const sideMenu = document.getElementById('side-menu');
        const menuOverlay = document.getElementById('menu-overlay');
        const menuContent = document.getElementById('menu-content');

        function openMenu() {
            sideMenu.classList.remove('hidden');
            setTimeout(() => { menuContent.classList.remove('translate-x-full'); }, 10);
        }
        function closeMenu() {
            menuContent.classList.add('translate-x-full');
            setTimeout(() => { sideMenu.classList.add('hidden'); }, 300);
        }
        if (openMenuBtn) openMenuBtn.addEventListener('click', openMenu);
        if (closeMenuBtn) closeMenuBtn.addEventListener('click', closeMenu);
        if (menuOverlay) menuOverlay.addEventListener('click', closeMenu);

        // قراءة اسم القسم الرئيسي من الـ URL (مثال: subcategories.html?cat=أجهزة منزلية)
        const urlParams = new URLSearchParams(window.location.search);
        const parentCategoryName = urlParams.get('cat');

        async function loadSubcategoriesAndBanners() {
            const titleEl = document.getElementById('main-category-title');
            const subContainer = document.getElementById('subcategories-container');
            const bannersContainer = document.getElementById('banners-container');

            if (!parentCategoryName) {
                titleEl.innerText = "لم يتم تحديد القسم";
                subContainer.innerHTML = '<div class="col-span-full text-center py-12 text-gray-400 text-sm">عذراً، لم تقم باختيار قسم رئيسي صحيح.</div>';
                return;
            }

            titleEl.innerText = `قسم: ${parentCategoryName}`;

            try {
                // 1. جلب الأقسام الفرعية التابعة لهذا القسم الرئيسي
                const { data: subcategories, error: subError } = await db
                    .from('categories')
                    .select('*')
                    .eq('parent_name', parentCategoryName);

                if (subError) throw subError;

                if (!subcategories || subcategories.length === 0) {
                    subContainer.innerHTML = `
                        <div class="col-span-full text-center py-12 bg-white rounded-2xl border border-gray-100 shadow-sm">
                            <p class="text-gray-400 text-sm font-medium">لا توجد أقسام فرعية مضافة تحت هذا القسم حالياً.</p>
                            <a href="section.html?cat=${encodeURIComponent(parentCategoryName)}" class="inline-block mt-4 bg-orange-600 text-white text-xs font-bold px-4 py-2 rounded-xl shadow-sm">تصفح إعلانات القسم مباشرة</a>
                        </div>
                    `;
                } else {
                    subContainer.innerHTML = '';
                    subcategories.forEach(sub => {
                        const iconSrc = sub.image_url ? sub.image_url : 'logo192.png';
                        // عند الضغط على القسم الفرعي، يذهب لصفحة section.html لعرض المنتجات الجديدة والمستعملة
                        const card = `
                            <a href="section.html?cat=${encodeURIComponent(sub.name)}" class="bg-white border border-gray-100 rounded-2xl p-4 flex flex-col items-center justify-center text-center shadow-sm hover:border-orange-500 hover:shadow-md transition-all group">
                                <div class="w-16 h-16 bg-orange-50/50 rounded-2xl flex items-center justify-center mb-3 overflow-hidden shadow-inner border border-orange-100/50 group-hover:scale-105 transition-transform">
                                    <img src="${iconSrc}" alt="${sub.name}" class="w-full h-full object-cover">
                                </div>
                                <h4 class="font-bold text-gray-800 text-sm group-hover:text-orange-600 transition-colors truncate w-full">${sub.name}</h4>
                                <span class="text-[11px] text-gray-400 mt-1">تصفح المنتجات</span>
                            </a>
                        `;
                        subContainer.innerHTML += card;
                    });
                }

                // 2. جلب البنرات الدعائية
                const { data: banners, error: bannerError } = await db
                    .from('banners')
                    .select('*')
                    .eq('active', true);

                if (!bannerError && banners && banners.length > 0) {
                    bannersContainer.innerHTML = '';
                    banners.forEach(banner => {
                        bannersContainer.innerHTML += `
                            <a href="${banner.link || '#'}" class="block rounded-2xl overflow-hidden shadow-sm border border-gray-100 hover:shadow-md transition-all">
                                <img src="${banner.image_url}" alt="إعلان ممول" class="w-full h-36 md:h-44 object-cover">
                            </a>
                        `;
                    });
                } else {
                    // بنر ترحيبي افتراضي لو مفيش بنرات حالياً
                    bannersContainer.innerHTML = `
                        <div class="col-span-full bg-gradient-to-r from-orange-500 to-amber-500 rounded-2xl p-6 text-white shadow-sm flex items-center justify-between">
                            <div>
                                <span class="bg-white/20 text-[10px] px-2.5 py-1 rounded-full font-bold">مساحة إعلانية مميزة</span>
                                <h3 class="text-lg font-black mt-2">أعلن عن منتجاتك هنا الآن!</h3>
                                <p class="text-xs text-white/90 mt-1">ساهم في نشر إعلاناتك لآلاف الزوار مجاناً لفترة محدودة.</p>
                            </div>
                            <a href="add-ad.html" class="bg-white text-orange-600 px-4 py-2 rounded-xl text-xs font-bold shadow-sm whitespace-nowrap hover:bg-orange-50 transition-colors">أضف إعلانك</a>
                        </div>
                    `;
                }

            } catch (err) {
                console.error('خطأ في جلب الأقسام الفرعية:', err.message);
                titleEl.innerText = "خطأ في التحميل";
                subContainer.innerHTML = '<div class="col-span-full text-center py-12 text-red-400 text-sm">تعذر جلب الأقسام، تأكد من اتصال الإنترنت.</div>';
            }
        }

        loadSubcategoriesAndBanners();
    </script>
</body>
</html>
