<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الرئيسية - متجر البيت (albet.store)</title>
    
    <!-- حماية الصفحة -->
    <script>
        if (localStorage.getItem('isAdminLoggedIn') !== 'true') {
            alert('عذراً، يجب تسجيل الدخول أولاً!');
            window.location.href = 'admin-login.html';
        }
    </script>

    <!-- Bootstrap 5 RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/rtl.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Cairo', sans-serif;
            color: #1e293b;
            margin: 0;
            padding: 20px;
        }

        /* 1. الهيدر العلوي */
        .admin-header {
            background: #111827;
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .admin-logo {
            width: 45px;
            height: 45px;
            object-fit: contain;
            background: white;
            padding: 4px;
            border-radius: 8px;
        }
        .btn-logout {
            background-color: #e76f51;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-logout:hover {
            background-color: #d9532b;
        }

        /* 2. التخطيط الرئيسي: السايدبار يمين والمحتوى شمال */
        .main-dashboard-layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            flex-direction: row; /* يضمن الترتيب الصح: يمين سايدبار، شمال محتوى */
        }

        /* السايدبار الجانبي (في اليمين تماماً) */
        .sidebar-box {
            width: 260px;
            background: white;
            border: 2px solid #111827;
            border-radius: 14px;
            padding: 15px 10px;
            flex-shrink: 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }
        .sidebar-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #334155;
            padding: 8px 10px;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .sidebar-menu-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .side-btn {
            background: transparent;
            color: #334155;
            border: 1px solid transparent;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            transition: all 0.2s;
        }
        .side-btn:hover {
            background-color: #f1f5f9;
            color: #0f172a;
        }
        .side-btn.active {
            background-color: #fef2f2;
            color: #dc2626;
            border-color: #fecaca;
        }
        .side-btn .badge-dot {
            width: 6px;
            height: 6px;
            background-color: #0f172a;
            border-radius: 50%;
        }
        .side-btn.active .badge-dot {
            background-color: #dc2626;
        }

        /* منطقة المحتوى الكبيرة (في الشمال تماماً) */
        .content-frame-box {
            flex-grow: 1;
            background: white;
            border: 2px solid #111827;
            border-radius: 14px;
            padding: 20px;
            min-height: 600px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        /* تنسيق الجدول */
        .table th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 700;
            font-size: 0.85rem;
            border-bottom: 2px solid #e2e8f0;
        }
        .table td {
            font-size: 0.85rem;
            vertical-align: middle;
        }
        .ad-img, .proof-img {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }
        .proof-img {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- الهيدر العلوي -->
    <div class="admin-header">
        <!-- اللوجو والاسم في أقصى اليمين -->
        <div class="admin-brand">
            <img src="logo192.png" alt="متجر البيت" class="admin-logo">
            <div>
                <h3 class="m-0 fw-bold fs-6 text-start">متجر البيت</h3>
                <small class="text-light opacity-75" style="font-size: 0.75rem;">لوحة تحكم المدير العام - albet.store</small>
            </div>
        </div>

        <!-- زر تسجيل الخروج في أقصى الشمال -->
        <button class="btn-logout" onclick="logoutAdmin()">
            تسجيل الخروج <i class="bi bi-box-arrow-left ms-1"></i>
        </button>
    </div>

    <!-- التخطيط الرئيسي (السايدبار يمين والمحتوى شمال) -->
    <div class="main-dashboard-layout">
        
        <!-- 1. القائمة الجانبية (في اليمين) -->
        <div class="sidebar-box">
            <div class="sidebar-title">
                <span>أقسام الإدارة والتقارير الشاملة</span>
                <i class="bi bi-grid-fill text-dark"></i>
            </div>
            
            <div class="sidebar-menu-list">
                <a href="admin-dashboard.html" class="side-btn active">
                    <span>مراجعة الإعلانات</span>
                    <span class="badge-dot"></span>
                </a>
                <a href="staff.html" class="side-btn">
                    <span>إضافة موظف</span>
                    <span class="badge-dot"></span>
                </a>
                <a href="categories.html" class="side-btn">
                    <span>إضافة قسم</span>
                    <span class="badge-dot"></span>
                </a>
                <a href="daily-report.html" class="side-btn">
                    <span>تقرير اليوم</span>
                    <span class="badge-dot"></span>
                </a>
                <a href="profits.html" class="side-btn">
                    <span>الأرباح والخسائر</span>
                    <span class="badge-dot"></span>
                </a>
                <a href="salaries.html" class="side-btn">
                    <span>المرتبات</span>
                    <span class="badge-dot"></span>
                </a>
                <a href="expenses.html" class="side-btn">
                    <span>المصروفات</span>
                    <span class="badge-dot"></span>
                </a>
            </div>
        </div>

        <!-- 2. منطقة المحتوى الكبيرة (في الشمال) -->
        <div class="content-frame-box">
            <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
                <span class="fw-bold fs-6 text-secondary"><i class="bi bi-list-check ms-1"></i> الإعلانات المعلقة والإيصالات المالية</span>
                <button class="btn btn-sm btn-outline-dark fw-bold px-3" onclick="loadPendingAds()" style="font-size: 0.8rem;">
                    <i class="bi bi-arrow-clockwise ms-1"></i> تحديث
                </button>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                        <tr>
                            <th class="text-center">صورة الإعلان</th>
                            <th class="text-center">إيصال الدفع</th>
                            <th>عنوان الإعلان</th>
                            <th>القسم</th>
                            <th>السعر</th>
                            <th>تاريخ الرفع</th>
                            <th class="text-center">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="pendingAdsTableBody">
                        <tr><td colspan="7" class="text-center text-muted py-5">جاري التحميل...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- المكتبات والبرمجيات -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        const SUPABASE_URL = 'https://usaqiylvcnmccgpnxwaq.supabase.co';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        window.onload = () => { loadPendingAds(); };

        async function loadPendingAds() {
            const tbody = document.getElementById('pendingAdsTableBody');
            const { data, error } = await supabaseClient.from('ads').select('*').eq('status', 'pending');
            
            if (error) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">خطأ في الاتصال بقاعدة البيانات</td></tr>`;
                return;
            }
            
            if (data && data.length > 0) {
                tbody.innerHTML = data.map(ad => `
                    <tr>
                        <td class="text-center"><img src="${ad.image_url || 'https://via.placeholder.com/55'}" class="ad-img"></td>
                        <td class="text-center">${ad.payment_proof_url ? `<img src="${ad.payment_proof_url}" class="proof-img" onclick="window.open('${ad.payment_proof_url}', '_blank')">` : 'لا يوجد'}</td>
                        <td class="fw-bold">${ad.title}</td>
                        <td><span class="badge bg-secondary" style="font-size:0.75rem;">${ad.category}</span></td>
                        <td class="fw-bold text-success">${ad.price} جنيه</td>
                        <td>${new Date(ad.created_at).toLocaleDateString('ar-EG')}</td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-success px-2 py-1 mb-1" style="font-size:0.75rem;" onclick="approveAd('${ad.id}')">اعتماد</button>
                            <button class="btn btn-sm btn-danger px-2 py-1 mb-1" style="font-size:0.75rem;" onclick="rejectAd('${ad.id}')">رفض</button>
                        </td>
                    </tr>
                `).join('');
            } else {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-5">لا توجد إعلانات معلقة حالياً. المنصة نظيفة تماماً!</td></tr>';
            }
        }

        async function logoutAdmin() {
            localStorage.removeItem('isAdminLoggedIn');
            window.location.href = 'admin-login.html';
        }
    </script>
</body>
</html>
