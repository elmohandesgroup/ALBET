<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - متجر البيت (albet.store)</title>
    
    <!-- Bootstrap 5 RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/rtl.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Cairo', sans-serif;
            color: #1e293b;
            margin: 0;
            padding: 20px;
        }

        /* الهيدر العلوي الأساسي المضبوط */
        .top-navbar-box {
            background: #111827;
            color: white;
            padding: 15px 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .brand-section {
            display: flex;
            align-items: center;
        }

        .admin-logo {
            width: 45px;
            height: 45px;
            object-fit: contain;
            background: white;
            padding: 4px;
            border-radius: 8px;
        }

        /* زر القائمة الجانبية (الهامبرغر) في أقصى اليمين */
        .menu-toggler-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 0;
            transition: opacity 0.2s;
        }
        .menu-toggler-btn:hover {
            opacity: 0.8;
        }

        /* تنسيق القائمة الجانبية المنزلقة */
        .offcanvas {
            width: 300px !important;
        }
    </style>
</head>
<body>

    <!-- الهيدر العلوي -->
    <div class="top-navbar-box">
        <!-- 1. زر الـ 3 شرط في أقصى اليمين -->
        <button class="menu-toggler-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#adminSidebarMenu" aria-controls="adminSidebarMenu">
            <i class="bi bi-list"></i>
        </button>

        <!-- 2. العنوان في المنتصف -->
        <div class="text-center">
            <h3 class="m-0 fw-bold fs-6">متجر البيت</h3>
            <small class="text-light opacity-75" style="font-size: 0.72rem;">لوحة تحكم المدير العام - albet.store</small>
        </div>

        <!-- 3. اللوجو في أقصى اليسار -->
        <div class="brand-section">
            <img src="logo192.png" alt="متجر البيت" class="admin-logo">
        </div>
    </div>

    <!-- القائمة الجانبية المنزلقة -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="adminSidebarMenu" aria-labelledby="adminSidebarMenuLabel">
        <div class="offcanvas-header bg-dark text-white">
            <div class="d-flex align-items-center gap-2">
                <img src="logo192.png" alt="متجر البيت" style="width: 30px; height: 30px; background: white; padding: 2px; border-radius: 6px;">
                <h5 class="offcanvas-title fs-6 fw-bold" id="adminSidebarMenuLabel">متجر البيت</h5>
            </div>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        
        <div class="offcanvas-body bg-light d-flex flex-column justify-content-between">
            <div class="text-center py-5 text-muted">
                <i class="bi bi-hourglass-split fs-3 d-block mb-2"></i>
                <p class="small m-0">القائمة فارغة حالياً..<br>سنضيف الأقسام هنا براحتنا لاحقاً.</p>
            </div>
            
            <div>
                <button class="btn btn-danger w-100 py-2 fw-bold" onclick="alert('تم تسجيل الخروج')">
                    <span>تسجيل الخروج</span> <i class="bi bi-box-arrow-left"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- المساحة تحت الهيدر نظيفة تماماً وخالية من أي مخلفات -->
    <div class="container text-center py-5">
        <h5 class="text-muted fw-bold">هذه المساحة فارغة وجاهزة.. قول لي نحط فيها إيه الخطوة الجاية؟</h5>
    </div>

    <!-- المكتبات -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
