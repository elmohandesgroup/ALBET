<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المدير العام - متجر البيت</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/rtl.min.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <h1 class="mb-4 text-center">إمبراطورية متجر البيت - لوحة تحكم المدير</h1>

        <!-- قسم إضافة موظف جديد -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">إضافة موظف مراجعة جديد</div>
            <div class="card-body">
                <form id="addStaffForm" onsubmit="addNewStaff(event)">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <input type="text" id="staffName" class="form-control" placeholder="اسم الموظف" required>
                        </div>
                        <div class="col-md-3">
                            <input type="email" id="staffEmail" class="form-control" placeholder="البريد الإلكتروني" required>
                        </div>
                        <div class="col-md-3">
                            <select id="staffCategory" class="form-select" required>
                                <option value="">اختر القسم المسند</option>
                                <option value="عقارات">عقارات</option>
                                <option value="سيارات">سيارات ووسائل نقل</option>
                                <option value="إلكترونيات">إلكترونيات وموبايلات</option>
                                <option value="خدمات">خدمات وورش</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-success w-100">حفظ وإضافة الموظف</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- جدول إدارة الموظفين الحالية -->
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">قائمة الموظفين والصلاحيات</div>
            <div class="card-body">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>الاسم</th>
                            <th>البريد الإلكتروني</th>
                            <th>القسم المسند</th>
                            <th>الحالة</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="staffTableBody">
                        <!-- سيتم تعبئة البيانات برمجياً عبر الـ JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ربط مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="staff-management.js"></script>
    <script>
        // تهيئة اتصال Supabase (استبدل بالبيانات الخاصة بمشروعك)
        const SUPABASE_URL = 'https://usaqiylvcnmccgpnxwaq.supabase.co';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const staffManager = new StaffManager(supabaseClient);

        // دالة عرض الموظفين في الجدول
        async function loadStaffData() {
            const result = await staffManager.fetchAllStaff();
            const tbody = document.getElementById('staffTableBody');
            tbody.innerHTML = '';

            if (result.success && result.data) {
                result.data.forEach(staff => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${staff.name}</td>
                            <td>${staff.email}</td>
                            <td><span class="badge bg-secondary">${staff.assigned_category || 'عام'}</span></td>
                            <td><span class="badge bg-${staff.is_active ? 'success' : 'danger'}">${staff.is_active ? 'نشط' : 'معطل'}</span></td>
                            <td>
                                <button class="btn btn-sm btn-outline-warning" onclick="toggleStatus('${staff.id}', ${staff.is_active})">
                                    ${staff.is_active ? 'تعطيل' : 'تفعيل'}
                                </button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteStaff('${staff.id}')">حذف</button>
                            </td>
                        </tr>
                    `;
                });
            }
        }

        // دالة إضافة موظف من النموذج
        async function addNewStaff(event) {
            event.preventDefault();
            const name = document.getElementById('staffName').value;
            const email = document.getElementById('staffEmail').value;
            const category = document.getElementById('staffCategory').value;

            const res = await staffManager.addStaffMember(name, email, 'moderator', category);
            if (res.success) {
                alert(res.message);
                document.getElementById('addStaffForm').reset();
                loadStaffData();
            } else {
                alert('خطأ: ' + res.error);
            }
        }

        async function toggleStatus(id, currentStatus) {
            await staffManager.toggleStaffStatus(id, currentStatus);
            loadStaffData();
        }

        async function deleteStaff(id) {
            if (confirm('هل أنت متأكد من حذف هذا الموظف نهائياً؟')) {
                await staffManager.deleteStaffMember(id);
                loadStaffData();
            }
        }

        // تحميل البيانات عند فتح الصفحة
        window.onload = loadStaffData;
    </script>
</body>
</html>
