<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الموظفين - متجر البيت (albet.store)</title>
    <!-- Bootstrap 5 RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/rtl.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Google Font Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Cairo', sans-serif;
            color: #1e293b;
            margin: 0;
            padding: 0;
        }
        /* مطابقة ستايل لوحة التحكم الرئيسية */
        .admin-header {
            background: #111827;
            color: white;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .admin-logo {
            font-weight: 700;
            font-size: 1.25rem;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>

    <!-- الهيدر العلوي المطابق للوحة التحكم -->
    <header class="admin-header">
        <a href="admin-dashboard.html" class="admin-logo">
            <i class="bi bi-house-gear-fill text-primary"></i> متجر البيت - إدارة الموظفين
        </a>
        <div>
            <a href="admin-dashboard.html" class="btn btn-outline-light btn-sm">
                <i class="bi bi-arrow-right ms-1"></i> عودة لوحة التحكم
            </a>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <div class="container py-5">
        <div class="row mb-4">
            <div class="col-12">
                <h2 class="fw-bold text-dark">إدارة الموظفين والصلاحيات</h2>
                <p class="text-muted">إضافة موظفين جدد وتحديد صلاحياتهم وتفعيل/تعطيل حساباتهم على الأقسام.</p>
            </div>
        </div>

        <!-- نموذج إضافة موظف جديد -->
        <div class="card mb-5">
            <div class="card-body p-4">
                <h4 class="card-title mb-4 fw-bold text-secondary"><i class="bi bi-person-plus-fill ms-2"></i> إضافة موظف جديد</h4>
                <form id="addStaffForm" onsubmit="handleAddNewStaff(event)">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="staffName" class="form-label fw-bold">اسم الموظف</label>
                            <input type="text" class="form-control" id="staffName" required placeholder="الاسم الكامل">
                        </div>
                        <div class="col-md-4">
                            <label for="staffEmail" class="form-label fw-bold">البريد الإلكتروني</label>
                            <input type="email" class="form-control" id="staffEmail" required placeholder="name@albet.store">
                        </div>
                        <div class="col-md-4">
                            <label for="staffPassword" class="form-label fw-bold">كلمة المرور المؤقتة</label>
                            <input type="password" class="form-control" id="staffPassword" required placeholder="********">
                        </div>
                        <div class="col-md-4">
                            <label for="staffPhone" class="form-label fw-bold">رقم الهاتف</label>
                            <input type="text" class="form-control" id="staffPhone" placeholder="010xxxxxxxx">
                        </div>
                        <div class="col-md-4">
                            <label for="assignedCategory" class="form-label fw-bold">القسم المسؤول عنه</label>
                            <select class="form-select" id="assignedCategory" required>
                                <option value="">اختر القسم...</option>
                                <option value="إلكترونيات">إلكترونيات</option>
                                <option value="عقارات">عقارات</option>
                                <option value="سيارات">سيارات</option>
                                <option value="أزياء وملابس">أزياء وملابس</option>
                                <option value="خدمات وصيانة">خدمات وصيانة</option>
                            </select>
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                                <i class="bi bi-check-lg ms-1"></i> حفظ وإضافة الموظف
                            </button>
                        </div>
                    </div>
                </form>
                <div id="formAlert" class="mt-3"></div>
            </div>
        </div>

        <!-- جدول عرض الموظفين الحاليين -->
        <div class="card">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-people-fill ms-2"></i> قائمة الموظفين المسجلين</h5>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="py-3 ps-4">اسم الموظف</th>
                                <th>البريد الإلكتروني</th>
                                <th>القسم</th>
                                <th>الهاتف</th>
                                <th>الحالة</th>
                                <th class="text-center">الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="staffTableBody">
                            <tr>
                                <td colspan="6" class="text-center py-4 text-muted">جاري تحميل بيانات الموظفين...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://usaqiylvnmccgnpxwaq.supabase.co';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.addEventListener('DOMContentLoaded', () => {
            fetchStaffList();
        });

        async function fetchStaffList() {
            const tbody = document.getElementById('staffTableBody');
            try {
                const { data, error } = await supabaseClient.from('staff_members').select('*');
                if (error) throw error;

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-muted">لا يوجد موظفين مسجلين حالياً.</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                data.forEach(staff => {
                    tbody.innerHTML += `
                        <tr>
                            <td class="ps-4 fw-bold">${staff.name || 'بدون اسم'}</td>
                            <td>${staff.email}</td>
                            <td><span class="badge bg-info text-dark">${staff.assigned_category || 'عام'}</span></td>
                            <td>${staff.phone || 'غير محدد'}</td>
                            <td>
                                <span class="badge ${staff.is_active ? 'bg-success' : 'bg-danger'}">
                                    ${staff.is_active ? 'نشط' : 'معطل'}
                                </span>
                            </td>
                            <td class="text-center">
                                <button class="btn btn-sm ${staff.is_active ? 'btn-outline-danger' : 'btn-outline-success'}" onclick="toggleStaffStatus('${staff.id}', ${!staff.is_active})">
                                    ${staff.is_active ? 'تعطيل' : 'تفعيل'}
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error('خطأ في جلب الموظفين:', err.message);
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-danger">حدث خطأ أثناء الاتصال بقاعدة البيانات.</td></tr>`;
            }
        }

        async function handleAddNewStaff(event) {
            event.preventDefault();
            const alertDiv = document.getElementById('formAlert');
            
            const name = document.getElementById('staffName').value;
            const email = document.getElementById('staffEmail').value;
            const password = document.getElementById('staffPassword').value;
            const phone = document.getElementById('staffPhone').value;
            const assignedCategory = document.getElementById('assignedCategory').value;

            try {
                const { data, error } = await supabaseClient.from('staff_members').insert([
                    { name, email, phone, assigned_category: assignedCategory, is_active: true }
                ]).select();

                if (error) throw error;

                alertDiv.innerHTML = `<div class="alert alert-success">تم إضافة الموظف بنجاح!</div>`;
                document.getElementById('addStaffForm').reset();
                fetchStaffList();
            } catch (err) {
                alertDiv.innerHTML = `<div class="alert alert-danger">خطأ: ${err.message}</div>`;
            }
        }

        async function toggleStaffStatus(id, newStatus) {
            try {
                const { error } = await supabaseClient
                    .from('staff_members')
                    .update({ is_active: newStatus })
                    .eq('id', id);

                if (error) throw error;
                fetchStaffList();
            } catch (err) {
                alert('فشل تحديث حالة الموظف: ' + err.message);
            }
        }
    </script>
</body>
</html>
