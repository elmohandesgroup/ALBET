<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إعلانات القسم - متجر البيت</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Google Fonts (Cairo) -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8f9fa;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

    <!-- الهيدر الرئيسي -->
    <header class="bg-white shadow-sm sticky top-0 z-50 px-4 py-3.5">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button id="open-menu-btn" class="p-1.5 text-gray-700 hover:text-orange-600 transition-colors focus:outline-none" aria-label="فتح القائمة">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
                <!-- زر الرئيسية المعدل لمنع الكاش -->
                <a href="index.html" onclick="event.preventDefault(); localStorage.clear(); sessionStorage.clear(); window.location.replace('index.html?v=' + Date.now());" class="flex items-center cursor-pointer">
                    <img src="logo192.png" alt="متجر البيت" class="w-12 h-12 object-contain rounded-xl shadow-sm border border-gray-100 bg-white p-1">
                </a>
            </div>

            <div class="text-center flex-1 mx-2">
                <a href="index.html" onclick="event.preventDefault(); localStorage.clear(); sessionStorage.clear(); window.location.replace('index.html?v=' + Date.now());" class="block cursor-pointer">
                    <h1 class="text-lg md:text-2xl font-black text-orange-600 leading-tight">متجر البيت</h1>
                    <p class="text-[11px] md:text-xs text-gray-500 font-medium">الأفضل دائماً</p>
                </a>
            </div>

            <div class="flex items-center">
                <a href="add-ad.html" class="bg-orange-600 hover:bg-orange-700 text-white px-3.5 py-2 rounded-xl text-xs md:text-sm font-bold transition-all shadow-sm flex items-center gap-1.5 whitespace-nowrap">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    <span>أضف إعلانك</span>
                </a>
            </div>
        </div>
    </header>

    <!-- القائمة الجانبية (Drawer Menu) -->
    <div id="side-menu" class="fixed inset-0 z-50 hidden">
        <div id="menu-overlay" class="absolute inset-0 bg-black/50 transition-opacity"></div>
        <div class="absolute right-0 top-0 bottom-0 w-80 bg-white shadow-2xl p-5 flex flex-col justify-between transform transition-transform duration-300 translate-x-full overflow-y-auto" id="menu-content">
            <div>
                <div class="flex items-center justify-between pb-4 border-b mb-4">
                    <div class="flex items-center gap-2">
                        <img src="logo192.png" alt="متجر البيت" class="w-10 h-10 object-contain">
                        <span class="font-black text-orange-600 text-lg">متجر البيت</span>
                    </div>
                    <button id="close-menu-btn" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
                </div>
                
                <nav class="space-y-2">
                    <a href="index.html" onclick="event.preventDefault(); localStorage.clear(); sessionStorage.clear(); window.location.replace('index.html?v=' + Date.now());" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-bold text-gray-700 hover:bg-orange-50 hover:text-orange-600 transition-colors cursor-pointer">الرئيسية</a>
                    <a href="categories.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-bold text-gray-700 hover:bg-orange-50 hover:text-orange-600 transition-colors">الأقسام</a>
                    <a href="add-ad.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-bold text-gray-700 hover:bg-orange-50 hover:text-orange-600 transition-colors">أضف إعلانك الجديد</a>
                    
                    <button id="menuInstallBtn" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-bold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 transition-colors text-right">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                        </svg>
                        <span>تثبيت التطبيق على جهازك</span>
                    </button>

                    <div class="pt-2 pb-1 text-xs font-bold text-gray-400 px-3">سياسات المتجر</div>
                    <a href="privacy.html" class="block px-3 py-2 rounded-xl text-xs font-medium text-gray-600 hover:bg-gray-100">سياسة الاستخدام والخصوصية</a>
                    <a href="terms.html" class="block px-3 py-2 rounded-xl text-xs font-medium text-gray-600 hover:bg-gray-100">الشروط والأحكام</a>
                </nav>
            </div>
            <div class="text-center text-[11px] text-gray-400 pt-4 border-t">
                جميع الحقوق محفوظة &copy; متجر البيت 2026
            </div>
        </div>
    </div>

    <!-- محتوى الإعلانات والبانرات -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
        <!-- بانر الإعلانات العلوي -->
        <div id="topBannerAds" class="w-full"></div>

        <div class="categories-header-area bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <h2 id="main-section-title" class="font-black text-gray-900 text-base md:text-lg">إعلانات القسم</h2>
            <span id="ads-count" class="text-xs text-gray-400 font-semibold">جاري التحميل...</span>
        </div>

        <!-- شبكة عرض الإعلانات -->
        <div id="ads-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <div class="col-span-full text-center py-12 text-gray-400 text-sm">جاري تحميل الإعلانات...</div>
        </div>
    </main>

    <!-- السكريبتات البرمجية الأساسية -->
    <script>
        const SUPABASE_URL = 'https://usaqiylvcnmccgpnxwaq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_he-h5ysxqK0VLujbtAXcUg_K5qf1rSB';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // تشغيل القائمة الجانبية (Drawer Menu)
        const openMenuBtn = document.getElementById('open-menu-btn');
        const closeMenuBtn = document.getElementById('close-menu-btn');
        const sideMenu = document.getElementById('side-menu');
        const menuOverlay = document.getElementById('menu-overlay');
        const menuContent = document.getElementById('menu-content');

        function openMenu() {
            sideMenu.classList.remove('hidden');
            setTimeout(() => { menuContent.classList.remove('translate-x-full'); }, 10);
        }

        function closeMenu() {
            menuContent.classList.add('translate-x-full');
            setTimeout(() => { sideMenu.classList.add('hidden'); }, 300);
        }

        if (openMenuBtn) openMenuBtn.addEventListener('click', openMenu);
        if (closeMenuBtn) closeMenuBtn.addEventListener('click', closeMenu);
        if (menuOverlay) menuOverlay.addEventListener('click', closeMenu);

        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        const menuInstallBtn = document.getElementById('menuInstallBtn');
        if (menuInstallBtn) {
            menuInstallBtn.addEventListener('click', async () => {
                closeMenu();
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    deferredPrompt = null;
                }
            });
        }

        // دالة الـ Slider للبانرات
        function setupSlider(containerId, mediaArray) {
            const container = document.getElementById(containerId);
            if (!container || mediaArray.length === 0) return;

            let slidesHtml = '';
            mediaArray.forEach((media, index) => {
                slidesHtml += `
                    <div class="absolute inset-0 transition-opacity duration-700 ease-in-out ${index === 0 ? 'opacity-100 z-10' : 'opacity-0 z-0'} ${containerId}-slide">
                        <div class="w-full h-40 md:h-56 rounded-2xl overflow-hidden shadow-sm bg-gray-100 relative">
                            <img src="${media.url}" alt="${media.title || 'إعلان مميز'}" class="w-full h-full object-cover">
                        </div>
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="relative w-full h-40 md:h-56 rounded-2xl shadow-sm overflow-hidden">
                    ${slidesHtml}
                </div>
            `;

            if (mediaArray.length > 1) {
                let currentIdx = 0;
                const slides = container.querySelectorAll(`.${containerId}-slide`);
                setInterval(() => {
                    slides[currentIdx].classList.remove('opacity-100', 'z-10');
                    slides[currentIdx].classList.add('opacity-0', 'z-0');
                    currentIdx = (currentIdx + 1) % slides.length;
                    slides[currentIdx].classList.remove('opacity-0', 'z-0');
                    slides[currentIdx].classList.add('opacity-100', 'z-10');
                }, 3500);
            }
        }

        // جلب البانرات الخاصة بصفحة السكشن
        async function fetchBannerAds() {
            try {
                const { data: banners, error } = await db
                    .from('featured_companies')
                    .select('*')
                    .eq('position', 'above')
                    .eq('page_target', 'section.html');

                if (error || !banners) return;

                let allTopMedia = [];
                banners.forEach(banner => {
                    if (banner.images && banner.images.length > 0) {
                        banner.images.forEach(imgUrl => {
                            allTopMedia.push({ url: imgUrl, title: banner.title });
                        });
                    }
                });

                setupSlider('topBannerAds', allTopMedia);
            } catch (e) {
                console.log('خطأ في جلب البانرات:', e);
            }
        }

        // جلب الإعلانات بناءً على القسم أو القسم الفرعي القادم من الرابط
        async function fetchAds() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoryName = urlParams.get('cat');
            const subCategoryName = urlParams.get('sub');

            const container = document.getElementById('ads-container');
            const countLabel = document.getElementById('ads-count');
            const titleLabel = document.getElementById('main-section-title');

            if (!container) return;

            // تحديث مسار التنقل في العنوان (Breadcrumb)
            let breadcrumbHtml = `
                <div class="flex items-center gap-2 flex-wrap">
                    <a href="index.html" onclick="event.preventDefault(); localStorage.clear(); sessionStorage.clear(); window.location.replace('index.html?v=' + Date.now());" class="inline-flex items-center gap-1 bg-orange-50 hover:bg-orange-100 text-orange-600 border border-orange-200 px-3 py-1 rounded-xl text-xs font-bold transition-all shadow-sm cursor-pointer">
                        <span>الرئيسية</span>
                    </a>
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-orange-400 rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                    <a href="categories.html" class="inline-flex items-center gap-1 bg-orange-50 hover:bg-orange-100 text-orange-600 border border-orange-200 px-3 py-1 rounded-xl text-xs font-bold transition-all shadow-sm">
                        <span>الأقسام</span>
                    </a>
            `;

            if (categoryName) {
                breadcrumbHtml += `
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-orange-400 rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                    <span class="inline-flex items-center gap-1 bg-orange-600 text-white border border-orange-600 px-3 py-1 rounded-xl text-xs font-bold shadow-sm">
                        <span>${categoryName}</span>
                    </span>
                `;
            }

            if (subCategoryName) {
                breadcrumbHtml += `
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-orange-400 rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                    <span class="inline-flex items-center gap-1 bg-orange-600 text-white border border-orange-600 px-3 py-1 rounded-xl text-xs font-bold shadow-sm">
                        <span>${subCategoryName}</span>
                    </span>
                `;
            }

            breadcrumbHtml += `</div>`;
            titleLabel.innerHTML = breadcrumbHtml;

            try {
                // استعلام جلب الإعلانات من جدول الـ ads أو اسم الجدول عندك (تأكد من اسم جدول الإعلانات لديك مثل ads أو items)
                let query = db.from('ads').select('*');

                if (categoryName) {
                    query = query.eq('category', categoryName);
                }
                if (subCategoryName) {
                    query = query.eq('subcategory', subCategoryName);
                }

                const { data: ads, error } = await query;

                if (error) throw error;

                if (!ads || ads.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-center py-12 text-gray-400 text-sm">لا توجد إعلانات مضافة في هذا القسم حالياً.</div>';
                    countLabel.innerText = '0 إعلان';
                    return;
                }

                countLabel.innerText = `${ads.length} إعلان متاح`;
                container.innerHTML = '';

                ads.forEach(ad => {
                    const imgUrl = (ad.images && ad.images.length > 0) ? ad.images[0] : 'logo192.png';
                    const card = `
                        <a href="ad-details.html?id=${ad.id}" class="bg-white border border-gray-100 rounded-2xl overflow-hidden shadow-sm hover:border-orange-500 hover:shadow-md transition-all group flex flex-col">
                            <div class="w-full h-44 bg-gray-100 relative overflow-hidden">
                                <img src="${imgUrl}" alt="${ad.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform">
                            </div>
                            <div class="p-4 flex flex-col flex-1 justify-between">
                                <div>
                                    <h3 class="font-bold text-gray-800 text-sm group-hover:text-orange-600 transition-colors line-clamp-1 mb-1">${ad.title}</h3>
                                    <p class="text-xs text-gray-500 line-clamp-2 mb-3">${ad.description || ''}</p>
                                </div>
                                <div class="flex items-center justify-between pt-2 border-t border-gray-100">
                                    <span class="font-black text-orange-600 text-sm">${ad.price ? ad.price + ' جنيه' : ''}</span>
                                    <span class="text-[11px] text-gray-400">${ad.created_at ? new Date(ad.created_at).toLocaleDateString('ar-EG') : ''}</span>
                                </div>
                            </div>
                        </a>
                    `;
                    container.innerHTML += card;
                });

            } catch (err) {
                console.error('خطأ في جلب الإعلانات:', err.message);
                container.innerHTML = '<div class="col-span-full text-center py-12 text-red-400 text-sm">تعذر تحميل الإعلانات، حاول مرة أخرى.</div>';
                countLabel.innerText = 'خطأ';
            }
        }

        // عند تحميل الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            fetchAds();
            fetchBannerAds();
        });
    </script>
</body>
</html>
